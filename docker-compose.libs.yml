services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kratos_admin}
      MYSQL_USER: ${MYSQL_USER:-kratos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kratos}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kratos-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - kratos-admin-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kratos-admin-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["object-storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kratos-admin-minio:/data
    command: ["server", "/data", "--console-address", ":9001"]

volumes:
  kratos-admin-mysql:
  kratos-admin-redis:
  kratos-admin-minio:

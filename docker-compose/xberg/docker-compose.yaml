services:
  xberg-mcp:
    image: ghcr.io/xberg-io/xberg:1.3.9
    container_name: xberg-mcp
    command:
      - mcp
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --allowed-host
      - ${LAN_IP:-192.168.60.83}
      - --allowed-host
      - ${LAN_IP:-192.168.60.83}:18001
    ports:
      - "${LAN_IP:-192.168.60.83}:18001:8001"
    volumes:
      - ./data/xberg:/app/.xberg
    restart: unless-stopped

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Go security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # 后端当前使用尚未进入公共模块版本的 crypto API，固定检出对应依赖版本。
      - uses: actions/checkout@v7
        with:
          repository: liujitcn/go-utils
          ref: aa9494357b2be88dccdeda54d11bfdecb44af2e4
          path: go-utils
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod edit -replace=github.com/liujitcn/go-utils/crypto=../go-utils/crypto
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: 安装兼容 Go 1.27 的 Gosec
        # v2.29.0 默认的 x/tools 不能读取 Go 1.27 的 export data v5。
        run: |
          security_tools_dir=$(mktemp -d)
          trap 'rm -rf "$security_tools_dir"' EXIT
          cd "$security_tools_dir"
          go mod init kratos-admin-security-tools
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.51.0
          go install github.com/securego/gosec/v2/cmd/gosec
      - run: govulncheck ./...
      - run: gosec -exclude-generated -confidence high -severity high ./...

  frontend:
    name: Frontend dependency security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/admin/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dependency-security
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level high

  repository:
    name: Repository and image-context scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Taro/uni-app 使用独立工具链，由各自 workspace 的 pnpm 审计维护。
          skip-files: frontend/taro-app/pnpm-lock.yaml,frontend/uni-app/pnpm-lock.yaml
          exit-code: 1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-files: frontend/taro-app/pnpm-lock.yaml,frontend/uni-app/pnpm-lock.yaml
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

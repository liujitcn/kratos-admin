<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 助手对话原型</title>
    <style>
      :root {
        --kratos-color-background: #eef3f8;
        --kratos-bg-gradient: linear-gradient(180deg, #f4f9fd 0%, #e9f1f8 60%);
        --kratos-color-surface: #f4f9fd;
        --kratos-color-surface-2: #eef4fa;
        --kratos-color-surface-solid: #ffffff;
        --kratos-color-border: #e3eaf2;
        --kratos-color-border-accent: rgba(0, 150, 134, 0.28);
        --kratos-color-primary: #039e8c;
        --kratos-color-primary-deep: #00b3a0;
        --kratos-color-on-primary: #ffffff;
        --kratos-color-primary-soft: rgba(3, 158, 140, 0.08);
        --kratos-color-primary-soft-2: rgba(3, 158, 140, 0.1);
        --kratos-color-primary-edge: rgba(3, 158, 140, 0.3);
        --kratos-color-text: #102232;
        --kratos-color-text-muted: #5a7083;
        --kratos-color-text-dim: #9aabbb;
        --kratos-color-track: #e8eef5;
        --kratos-glow: 0 10px 26px rgba(0, 120, 110, 0.14);
        --ink: var(--kratos-color-text);
        --ink-soft: var(--kratos-color-text-muted);
        --muted: var(--kratos-color-text-dim);
        --line: var(--kratos-color-border);
        --line-strong: var(--kratos-color-border-accent);
        --canvas: var(--kratos-color-background);
        --surface: var(--kratos-color-surface-solid);
        --surface-soft: var(--kratos-color-surface);
        --accent: var(--kratos-color-primary);
        --accent-dark: var(--kratos-color-primary-deep);
        --accent-soft: var(--kratos-color-primary-soft);
        --warm: var(--kratos-color-surface-2);
        --warm-text: var(--kratos-color-text-muted);
        --warm-accent: var(--kratos-color-primary);
        --shadow: var(--kratos-glow);
        --radius-lg: 24px;
        --radius-md: 12px;
        --radius-sm: 8px;
      }

      .theme-dark {
        --kratos-color-background: #060a12;
        --kratos-bg-gradient: linear-gradient(180deg, #081120 0%, #060a12 40%);
        --kratos-color-surface: rgba(255, 255, 255, 0.035);
        --kratos-color-surface-2: rgba(255, 255, 255, 0.06);
        --kratos-color-surface-solid: #070d18;
        --kratos-color-border: rgba(255, 255, 255, 0.08);
        --kratos-color-border-accent: rgba(120, 230, 215, 0.16);
        --kratos-color-primary: #28f0d4;
        --kratos-color-primary-deep: #13c7b4;
        --kratos-color-on-primary: #031513;
        --kratos-color-primary-soft: rgba(40, 240, 212, 0.08);
        --kratos-color-primary-soft-2: rgba(40, 240, 212, 0.1);
        --kratos-color-primary-edge: rgba(40, 240, 212, 0.3);
        --kratos-color-text: #e9f4f6;
        --kratos-color-text-muted: #8aa0b4;
        --kratos-color-text-dim: #4e6378;
        --kratos-color-track: rgba(255, 255, 255, 0.06);
        --kratos-glow: 0 0 24px rgba(40, 240, 212, 0.35);
        --warm-text: var(--kratos-color-text-muted);
        --warm-accent: var(--kratos-color-primary);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--ink);
        background: var(--canvas);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .prototype-shell {
        min-height: 100vh;
        padding: 22px;
      }

      .prototype-note {
        width: min(1400px, 100%);
        margin: 0 auto 12px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-align: right;
      }

      .app {
        display: grid;
        grid-template-columns: 258px minmax(0, 1fr);
        width: min(1400px, 100%);
        min-height: 780px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .session-rail {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 24px 18px;
        border-right: 1px solid var(--line);
        background: var(--surface-soft);
      }

      .workspace-nav {
        display: grid;
        gap: 4px;
        margin: 0 0 18px;
      }

      .workspace-nav button {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 38px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--ink-soft);
        background: transparent;
        font-size: 12px;
        text-align: left;
      }

      .workspace-nav button:hover,
      .workspace-nav button.is-active {
        border-color: var(--line-strong);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .workspace-nav button span:nth-child(2) {
        flex: 1;
      }

      .workspace-nav__icon {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 7px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 13px;
      }

      .workspace-nav em {
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 999px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 10px;
        font-style: normal;
        line-height: 19px;
        text-align: center;
      }

      .drawer-divider {
        height: 1px;
        margin: 7px 0 17px;
        background: var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 8px 28px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        color: var(--kratos-color-on-primary);
        background: var(--accent);
        font-size: 19px;
      }

      .brand-copy strong,
      .brand-copy span {
        display: block;
      }

      .brand-copy strong {
        font-size: 15px;
        line-height: 1.2;
      }

      .brand-copy span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }

      .new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 42px;
        margin-bottom: 22px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        color: var(--accent-dark);
        background: var(--surface);
        font-size: 13px;
        font-weight: 650;
      }

      .new-chat:hover,
      .rail-action:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .rail-label {
        margin: 0 10px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .session-list {
        display: grid;
        gap: 5px;
      }

      .session-item {
        display: grid;
        gap: 4px;
        padding: 11px 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--ink-soft);
        background: transparent;
        text-align: left;
      }

      .session-item:hover,
      .session-item.is-active {
        border-color: var(--line-strong);
        background: var(--accent-soft);
      }

      .session-item strong {
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-item span {
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rail-spacer {
        flex: 1;
      }

      .rail-action {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 38px;
        padding: 0 11px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--ink-soft);
        background: transparent;
        font-size: 12px;
        text-align: left;
      }

      .chat-stage {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--surface);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 78px;
        padding: 0 34px;
        border-bottom: 1px solid var(--line);
      }

      .topbar-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .topbar-title h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .topbar-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .topbar-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 20px;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-toggle {
        display: none;
      }

      .theme-toggle {
        flex: 0 0 auto;
      }

      .nav-mask {
        position: fixed;
        z-index: 20;
        inset: 0;
        background: var(--kratos-color-mask, rgba(16, 34, 50, 0.45));
      }

      .nav-drawer {
        display: flex;
        flex-direction: column;
        width: min(320px, calc(100% - 42px));
        height: 100%;
        padding: 20px 18px;
        border-right: 1px solid var(--line);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .drawer-head .brand {
        margin: 0;
      }

      .drawer-new-chat {
        margin-top: auto;
        margin-bottom: 0;
      }

      .quiet-button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--ink-soft);
        background: var(--surface);
        font-size: 12px;
      }

      .quiet-button:hover {
        border-color: var(--accent);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .auto-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: min(980px, calc(100% - 68px));
        margin: 18px auto 0;
        padding: 10px 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 12px;
      }

      .auto-status__main,
      .auto-status__main span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .auto-status__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .auto-status button {
        padding: 0;
        color: var(--accent-dark);
        background: transparent;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .conversation {
        display: flex;
        flex: 1;
        flex-direction: column;
        width: min(980px, calc(100% - 68px));
        min-height: 0;
        margin: 0 auto;
        padding: 44px 0 30px;
        overflow: auto;
      }

      .empty-view {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        min-height: 430px;
      }

      .welcome-kicker {
        margin-bottom: 14px;
        color: var(--accent-dark);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .welcome-title {
        max-width: 670px;
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
        font-weight: 720;
        letter-spacing: -0.02em;
        line-height: 1.13;
      }

      .welcome-description {
        max-width: 620px;
        margin: 18px 0 0;
        color: var(--ink-soft);
        font-size: 16px;
        line-height: 1.7;
      }

      .welcome-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .welcome-tag {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
      }

      .prompt-panel {
        margin-top: 42px;
      }

      .prompt-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
      }

      .prompt-heading strong {
        font-size: 15px;
      }

      .prompt-heading span {
        color: var(--muted);
        font-size: 12px;
      }

      .prompt-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .prompt-card {
        display: flex;
        flex-direction: column;
        min-height: 136px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        color: var(--ink);
        background: var(--surface);
        text-align: left;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .prompt-card:hover {
        border-color: var(--line-strong);
        box-shadow: var(--kratos-glow-soft, none);
        transform: translateY(-2px);
      }

      .prompt-icon {
        display: grid;
        width: 31px;
        height: 31px;
        margin-bottom: 18px;
        place-items: center;
        border-radius: 10px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 15px;
      }

      .prompt-card strong {
        font-size: 14px;
        line-height: 1.45;
      }

      .prompt-card span {
        margin-top: auto;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .task-overview {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(210px, 0.8fr);
        gap: 24px;
        align-items: start;
      }

      .task-panel,
      .task-side-note {
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .task-panel {
        padding: 22px;
      }

      .task-panel__heading {
        margin: 0;
        font-size: 18px;
      }

      .task-panel__subheading {
        margin: 8px 0 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .task-step {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .task-step__number {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 9px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .task-step strong,
      .task-step span {
        display: block;
      }

      .task-step strong {
        font-size: 13px;
      }

      .task-step span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .task-side-note {
        padding: 20px;
        background: var(--warm);
      }

      .task-side-note__eyebrow {
        color: var(--warm-accent);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .task-side-note h3 {
        margin: 13px 0 8px;
        font-size: 17px;
      }

      .task-side-note p {
        margin: 0;
        color: var(--warm-text);
        font-size: 12px;
        line-height: 1.7;
      }

      .minimal-view {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 480px;
        text-align: center;
      }

      .minimal-view .welcome-title {
        max-width: 580px;
      }

      .minimal-view .welcome-description {
        max-width: 490px;
        margin-top: 14px;
        font-size: 14px;
      }

      .minimal-prompts {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 28px;
      }

      .minimal-prompt {
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink-soft);
        background: var(--surface);
        font-size: 12px;
      }

      .minimal-prompt:hover {
        border-color: var(--line-strong);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .management-view {
        padding: 4px 0 28px;
      }

      .management-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .management-head__eyebrow {
        margin-bottom: 7px;
        color: var(--accent-dark);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .management-head h2 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
      }

      .management-head p {
        max-width: 210px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        text-align: right;
      }

      .management-action {
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 12px;
        white-space: nowrap;
      }

      .management-list {
        display: grid;
        gap: 10px;
      }

      .management-card {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .management-card__icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 10px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 15px;
      }

      .management-card strong,
      .management-card span {
        display: block;
      }

      .management-card strong {
        overflow: hidden;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .management-card span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .management-card__state {
        min-width: 44px;
        padding: 5px 7px;
        border-radius: 999px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 10px;
        text-align: center;
      }

      .management-card__state.is-muted {
        color: var(--muted);
        background: var(--kratos-color-surface-2);
      }

      .management-empty-note {
        margin-top: 18px;
        padding: 12px 14px;
        border-left: 3px solid var(--accent);
        color: var(--ink-soft);
        background: var(--accent-soft);
        font-size: 12px;
        line-height: 1.6;
      }

      .message-list {
        display: grid;
        gap: 25px;
        margin-top: auto;
      }

      .message-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .message-row.is-user {
        justify-content: flex-end;
      }

      .message-avatar {
        display: grid;
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 11px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 15px;
      }

      .message-bubble {
        max-width: min(720px, 82%);
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        color: var(--ink);
        background: var(--surface);
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .message-row.is-user .message-bubble {
        border-color: var(--line-strong);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .message-context {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .message-context strong {
        color: var(--accent-dark);
        font-weight: 700;
      }

      .message-context button {
        padding: 0;
        color: var(--accent-dark);
        background: transparent;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .composer-area {
        width: min(980px, calc(100% - 68px));
        margin: 0 auto;
        padding: 14px 0 24px;
      }

      .composer {
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-md);
        background: var(--surface);

            <div class="welcome-kicker">TASK WORKSPACE / APP</div>
            <h2 class="welcome-title">先说结果，再一起拆解。</h2>
            <p class="welcome-description">适合需要连续推进的事情。助手会根据任务内容自动决定什么时候调用数据、文件或业务能力。</p>
            <div class="task-overview prompt-panel">
              <section class="task-panel">
                <h3 class="task-panel__heading">一个任务会这样开始</h3>
                <p class="task-panel__subheading">你不需要先想“该用哪个插件”，只需要描述完成标准。</p>
                ${taskStep('1', '说清楚目标', '例如：我要一份可以给老板看的周报。')}
                ${taskStep('2', '助手理解上下文', '自动识别是否需要数据、文件或知识库。')}
                ${taskStep('3', '给出结果并继续修改', '结果不满意时，直接在当前对话继续说。')}
              </section>
              <aside class="task-side-note">
                <div class="task-side-note__eyebrow">design principle</div>
                <h3>把配置藏起来</h3>
                <p>能力选择属于系统决策，不占用用户的注意力；只有真正执行时，才在消息里显示自动匹配结果。</p>
              </aside>
            </div>
          </section>`;
      }

      function renderMinimal() {
        return `
          <section class="minimal-view">
            <div class="welcome-kicker">JUST ASK</div>
            <h2 class="welcome-title">你现在想完成什么？</h2>
            <p class="welcome-description">不需要选插件，也不用先搭流程。自然地说出目标，助手会自己判断下一步。</p>
            <div class="minimal-prompts">
              ${minimalPrompt('总结这段内容', '帮我总结这段项目周报。')}
              ${minimalPrompt('分析本周数据', '帮我分析本周项目数据。')}
              ${minimalPrompt('规划下一步', '帮我安排下周的工作计划。')}
            </div>
          </section>`;
      }

      function promptCard(icon, title, meta, prompt) {
        return `<button class="prompt-card" type="button" data-prompt="${prompt}"><span class="prompt-icon">${icon}</span><strong>${title}</strong><span>${meta}</span></button>`;
      }

      function minimalPrompt(label, prompt) {
        return `<button class="minimal-prompt" type="button" data-prompt="${prompt}">${label}</button>`;
      }

      function taskStep(number, title, detail) {
        return `<div class="task-step"><span class="task-step__number">${number}</span><div><strong>${title}</strong><span>${detail}</span></div></div>`;
      }

      function setVariant(nextVariant, updateUrl = true) {
        activeVariant = variants[nextVariant] ? nextVariant : 'A';
        app.dataset.variant = activeVariant;
        variantTitle.textContent = variants[activeVariant].title;
        variantSubtitle.textContent = variants[activeVariant].subtitle;
        autoStatusText.textContent = variants[activeVariant].status;
        conversation.innerHTML = variants[activeVariant].render();
        document.querySelectorAll('[data-variant]').forEach((button) => {
          if (button.closest('.variant-switcher')) button.classList.toggle('is-active', button.dataset.variant === activeVariant);
        });
        if (updateUrl) history.replaceState({}, '', `?variant=${activeVariant}`);
        bindPromptButtons();
      }

      function bindPromptButtons() {
        conversation.querySelectorAll('[data-prompt]').forEach((button) => {
          button.addEventListener('click', () => {
            input.value = button.dataset.prompt || '';
            input.focus();
            updateSendState();
          });
        });
      }

      function resolveCapability(text) {
        if (/数据|报表|趋势|统计|看板|指标/.test(text)) return { name: '数据分析能力', detail: '识别到数据问题，已自动匹配分析与图表能力。' };
        if (/日程|会议|提醒|计划|安排|排期/.test(text)) return { name: '计划整理能力', detail: '识别到计划任务，已自动匹配整理与提醒能力。' };
        if (/总结|优化|改写|润色|提炼|周报/.test(text)) return { name: '文本处理能力', detail: '识别到文本任务，已自动匹配总结与改写能力。' };
        return { name: '通用推理能力', detail: '当前需求不需要额外工具，已使用通用推理能力完成。' };
      }

      function handleSubmit(event) {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        const capability = resolveCapability(text);
        const isEmpty = conversation.querySelector('.empty-view, .minimal-view');
        if (isEmpty) conversation.innerHTML = '<div class="message-list"></div>';
        const list = conversation.querySelector('.message-list') || conversation;
        const previous = list.querySelector('.message-list') ? list.querySelector('.message-list') : list;
        appendUserMessageTo(previous, text);
        input.value = '';
        updateSendState();
        setTimeout(() => {
          appendAssistantMessageTo(previous, resolveReply(text), capability);
          conversation.scrollTop = conversation.scrollHeight;
        }, 420);
      }

      function appendUserMessageTo(container, text) {
        const row = document.createElement('div');
        row.className = 'message-row is-user';
        row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
        container.appendChild(row);
      }

      function appendAssistantMessageTo(container, text, capability) {
        const row = document.createElement('div');
        row.className = 'message-row';
        row.innerHTML = `<div class="message-avatar">✦</div><div><div class="message-context"><strong>自动匹配 · ${capability.name}</strong><button type="button" data-action="routing">查看判断</button></div><div class="message-bubble">${escapeHtml(text)}</div></div>`;
        container.appendChild(row);
        row.querySelector('[data-action="routing"]').addEventListener('click', () => showRouting(capability));
      }

      function resolveReply(text) {
        if (/数据|报表|趋势|统计|看板|指标/.test(text)) return '我会先梳理时间范围、关键指标和异常变化，再把结果整理成一份易读的摘要。你可以继续补充数据范围或文件。';
        if (/日程|会议|提醒|计划|安排|排期/.test(text)) return '可以。我会先拆出目标、时间和优先级，再给你一份可以直接执行的安排。';
        if (/总结|优化|改写|润色|提炼|周报/.test(text)) return '收到。我会先提炼核心信息，再按你的使用场景整理成更清晰的版本。';
        return '收到。我会先理解你的目标和上下文，再给出下一步建议。';
      }

      function escapeHtml(value) {
        return value.replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
      }

      function updateSendState() {
        sendButton.disabled = !input.value.trim();
      }

      function showRouting(capability = { name: '自动匹配能力', detail: '系统会根据当前输入和会话上下文判断是否需要调用工具。' }) {
        toast.textContent = `${capability.name}：${capability.detail}`;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 3500);
      }

      document.getElementById('composer').addEventListener('submit', handleSubmit);
      input.addEventListener('input', updateSendState);
      document.querySelectorAll('.variant-switcher [data-variant]').forEach((button) => {
        button.addEventListener('click', () => setVariant(button.dataset.variant));
      });
      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.action;
          if (action === 'routing') showRouting();
          else if (action === 'new-chat') setVariant(activeVariant);
          else if (action === 'attachment') showToast('原型提示：这里接入文件上传，不涉及插件选择。');
          else if (action === 'voice') showToast('原型提示：这里接入语音输入。');
          else if (action === 'model') showToast('模型仍可按需调整，插件不需要手动选择。');
          else if (action === 'knowledge') showToast('知识库是可选上下文，和插件自动匹配是两条路径。');
          else if (action === 'history') showToast('原型提示：这里打开历史会话抽屉。');
          else if (action === 'settings') showToast('原型提示：这里进入助手偏好设置。');
        });
      });

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 3000);
      }

      setVariant(activeVariant, false);
    </script>
  </body>
</html>

components:
    schemas:
        base.v1.AiAction:
            type: object
            properties:
                flow:
                    type: string
                    description: Flow identifier
                step:
                    type: string
                    description: Flow step
                type:
                    type: string
                    description: action type
                payload_json:
                    type: string
                    description: Action payload JSON
                source_message_id:
                    type: string
                    description: action source message ID
                action_id:
                    type: string
                    description: Unique action ID
                flow_version:
                    type: string
                    description: flow status version
            description: AI assistant action
        base.v1.AiAttachment:
            type: object
            properties:
                id:
                    type: string
                    description: attachment ID
                name:
                    type: string
                    description: attachment name
                size:
                    type: string
                    description: attachment size
                url:
                    type: string
                    description: attachment address
                mime_type:
                    type: string
                    description: attachment MIME type
            description: AI assistant attachment
        base.v1.AiInputContent:
            type: object
            properties:
                kind:
                    type: string
                    description: content type
                content:
                    type: string
                    description: content body
            description: AI assistant input content
        base.v1.AiMessage:
            type: object
            properties:
                id:
                    type: string
                    description: message ID
                input_content:
                    $ref: '#/components/schemas/base.v1.AiInputContent'
                output_content:
                    $ref: '#/components/schemas/base.v1.AiOutputContent'
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiAttachment'
                    description: attachment list
                created_at:
                    type: string
                    description: Create time
                    format: date-time
                status:
                    enum:
                        - AI_MESSAGE_STATUS_UNSPECIFIED
                        - AI_MESSAGE_STATUS_GENERATING
                        - AI_MESSAGE_STATUS_SUCCESS
                        - AI_MESSAGE_STATUS_FAILED
                    type: string
                    description: "Message generation status: enum [AiMessageStatus]"
                    format: enum
                token:
                    $ref: '#/components/schemas/base.v1.AiToken'
                tools:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiToolCall'
                    description: tool-call records used by this message
                first_token_ms:
                    type: integer
                    description: first token durationms
                    format: int32
                duration_ms:
                    type: integer
                    description: totaldurationms
                    format: int32
            description: AI assistant message
        base.v1.AiOutputContent:
            type: object
            properties:
                kind:
                    type: string
                    description: content type
                content:
                    type: string
                    description: content body
                reply_source:
                    type: string
                    description: "response source: llm/fallback"
                model:
                    type: string
                    description: responseusageof model name
                fallback:
                    type: boolean
                    description: whether this is a fallback response
                fallback_reason:
                    type: string
                    description: fallback reason
                flow:
                    type: string
                    description: Flow identifier
                step:
                    type: string
                    description: Flow step
                blocks_json:
                    type: string
                    description: structured mobile content JSON
            description: AI assistant output content
        base.v1.AiSession:
            type: object
            properties:
                id:
                    type: string
                    description: session ID
                title:
                    type: string
                    description: session title
                summary:
                    type: string
                    description: session summary
                updated_at:
                    type: string
                    description: Update time
                    format: date-time
                terminal:
                    enum:
                        - TERMINAL_UNSPECIFIED
                        - TERMINAL_APP
                        - TERMINAL_ADMIN
                    type: string
                    description: "terminal type: enum【Terminal】"
                    format: enum
            description: AI assistant session
        base.v1.AiShortcut:
            type: object
            properties:
                key:
                    type: string
                    description: Shortcut identifier
                title:
                    type: string
                    description: display title
                prompt:
                    type: string
                    description: Send for the assistant prompt
                action:
                    $ref: '#/components/schemas/base.v1.AiShortcutAction'
                required_tools:
                    type: array
                    items:
                        type: string
                    description: dependency tool list
                sort:
                    type: integer
                    description: sort value
                    format: int32
                group:
                    type: string
                    description: Group name
            description: AI assistant shortcut
        base.v1.AiShortcutAction:
            type: object
            properties:
                flow:
                    type: string
                    description: Flow identifier
                step:
                    type: string
                    description: Flow step
                type:
                    type: string
                    description: action type
                payload_json:
                    type: string
                    description: Action payload JSON
            description: AI assistant shortcut action
        base.v1.AiToken:
            type: object
            properties:
                input:
                    type: integer
                    description: input token count
                    format: int32
                output:
                    type: integer
                    description: output token count
                    format: int32
                cache:
                    type: integer
                    description: cache token count
                    format: int32
                total:
                    type: integer
                    description: total token count
                    format: int32
            description: AI assistant token statistics
        base.v1.AiToolCall:
            type: object
            properties:
                type:
                    type: string
                    description: "tool type: function/server"
                name:
                    type: string
                    description: tool name
                title:
                    type: string
                    description: Tool display name
                status:
                    type: string
                    description: tool call status
                input:
                    type: string
                    description: Raw tool input JSON
                output:
                    type: string
                    description: Raw tool output JSON

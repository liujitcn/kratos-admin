                input:
                    type: integer
                    description: 输入 Token 数
                    format: int32
                output:
                    type: integer
                    description: 输出 Token 数
                    format: int32
                cache:
                    type: integer
                    description: 缓存 Token 数
                    format: int32
                total:
                    type: integer
                    description: 总 Token 数
                    format: int32

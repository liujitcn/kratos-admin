        base.v1.CreateAiSessionRequest:
            type: object
            properties:
                title:
                    type: string
                    description: Session title
                terminal:
                    enum:
                        - TERMINAL_UNSPECIFIED
                        - TERMINAL_APP
                        - TERMINAL_ADMIN
                    type: string
                    description: "Terminal type: enumeration [Terminal]"
                    format: enum
            description: AI Assistant Session Creation Request
        base.v1.CreateAiSessionResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/base.v1.AiSession'
            description: AI assistant session creation response
        base.v1.CreateOauthAuthorizationRequest:
            type: object
            properties:
                provider:
                    type: string
                    description: Login method identification
                redirect_url:
                    type: string
                    description: The front-end receiving address after the three-party login is completed
            description: Three-party login authorization address creation conditions
        base.v1.CreateOauthAuthorizationResponse:
            type: object

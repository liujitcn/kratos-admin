components:
    schemas:
        base.v1.AiAction:
            type: object
            properties:
                flow:
                    type: string
                    description: process identification
                step:
                    type: string
                    description: Process steps
                type:
                    type: string
                    description: Action type
                payload_json:
                    type: string
                    description: Action payload JSON
                source_message_id:
                    type: string
                    description: Action source message ID
                action_id:
                    type: string
                    description: Action unique ID
                flow_version:
                    type: string
                    description: Process status version
            description: AI assistant action
        base.v1.AiAttachment:
            type: object
            properties:
                id:
                    type: string
                    description: Attachment ID
                name:
                    type: string
                    description: Attachment name
                size:
                    type: string
                    description: Attachment size
                url:
                    type: string
                    description: Attachment address
                mime_type:
                    type: string
                    description: Attachment MIME type
            description: AI Assistant Attachment
        base.v1.AiInputContent:
            type: object
            properties:
                kind:
                    type: string
                    description: content type
                content:
                    type: string
                    description: Content text
            description: AI assistant input content
        base.v1.AiMessage:
            type: object
            properties:
                id:
                    type: string
                    description: Message ID
                input_content:
                    $ref: '#/components/schemas/base.v1.AiInputContent'
                output_content:
                    $ref: '#/components/schemas/base.v1.AiOutputContent'
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiAttachment'
                    description: Attachment list
                created_at:
                    type: string
                    description: Created at
                    format: date-time
                status:
                    enum:
                        - AI_MESSAGE_STATUS_UNSPECIFIED
                        - AI_MESSAGE_STATUS_GENERATING
                        - AI_MESSAGE_STATUS_SUCCESS
                        - AI_MESSAGE_STATUS_FAILED
                    type: string
                    description: "Message generation status: enumeration [AiMessageStatus]"
                    format: enum
                token:
                    $ref: '#/components/schemas/base.v1.AiToken'
                tools:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiToolCall'
                    description: Tool call record used in this message
                first_token_ms:
                    type: integer
                    description: The first Token takes milliseconds
                    format: int32
                duration_ms:
                    type: integer
                    description: Total elapsed time in milliseconds
                    format: int32
            description: AI assistant message
        base.v1.AiOutputContent:
            type: object
            properties:
                kind:
                    type: string
                    description: content type
                content:
                    type: string
                    description: Content text
                reply_source:
                    type: string
                    description: "Reply source: llm/fallback"
                model:
                    type: string
                    description: The model name used in the reply
                fallback:
                    type: boolean
                    description: Whether it is a downgrade reply
                fallback_reason:
                    type: string
                    description: Reason for downgrade
                flow:
                    type: string
                    description: process identification
                step:
                    type: string
                    description: Process steps
                blocks_json:
                    type: string
                    description: Mobile structured content JSON
            description: AI assistant output content
        base.v1.AiSession:
            type: object
            properties:
                id:
                    type: string
                    description: Session ID
                title:
                    type: string
                    description: Session title
                summary:
                    type: string
                    description: Session Summary
                updated_at:
                    type: string
                    description: Updated at
                    format: date-time
                terminal:
                    enum:
                        - TERMINAL_UNSPECIFIED
                        - TERMINAL_APP
                        - TERMINAL_ADMIN
                    type: string
                    description: "Terminal type: enumeration [Terminal]"
                    format: enum
            description: AI Assistant Session
        base.v1.AiShortcut:
            type: object
            properties:
                key:
                    type: string
                    description: Quick entry logo
                title:
                    type: string
                    description: Display title
                prompt:
                    type: string
                    description: Prompt word sent to assistant
                action:
                    $ref: '#/components/schemas/base.v1.AiShortcutAction'
                required_tools:
                    type: array
                    items:
                        type: string
                    description: Dependent tool list
                sort:
                    type: integer
                    description: sort value
                    format: int32
                group:
                    type: string
                    description: Group name
            description: AI Assistant Quick Entry
        base.v1.AiShortcutAction:
            type: object
            properties:
                flow:
                    type: string
                    description: process identification
                step:
                    type: string
                    description: Process steps
                type:
                    type: string
                    description: Action type
                payload_json:
                    type: string
                    description: Action payload JSON
            description: AI Assistant Quick Entry Action
        base.v1.AiToken:
            type: object
            properties:
                input:
                    type: integer
                    description: Enter the number of Tokens
                    format: int32
                output:
                    type: integer
                    description: Output Token number
                    format: int32
                cache:
                    type: integer
                    description: Number of cached tokens
                    format: int32
                total:
                    type: integer
                    description: Total number of Tokens
                    format: int32
            description: AI Assistant Token Statistics
        base.v1.AiToolCall:
            type: object
            properties:
                type:
                    type: string
                    description: "Tool type: function/server"
                name:
                    type: string
                    description: Tool name
                title:
                    type: string
                    description: Tool display name
                status:
                    type: string
                    description: Tool call status
                input:
                    type: string
                    description: Tool original input parameter JSON
                output:
                    type: string
                    description: tool original parameter JSON
            description: AI assistant tool call record
        base.v1.BindOauthSessionRequest:
            type: object
            properties:
                provider:
                    type: string
                    description: Login method identification
                code:
                    type: string
                    description: Third-party authorization code
                tenant_code:
                    type: string
                    description: Tenant code
                user_name:
                    type: string
                    description: Username
                password:
                    $ref: '#/components/schemas/common.v1.PasswordCrypto'
                captcha_code:
                    type: string
                    description: Verification code
                captcha_id:
                    type: string
                    description: Verification code Id
            description: Creation conditions for three-party login sessions bound to existing accounts
        base.v1.CaptchaResponse:
            type: object
            properties:
                captcha_id:
                    type: string
                    description: Verification code ID
                captcha_base64:
                    type: string
                    description: Verification code base64
                type:
                    type: string
                    description: The actual type of this verification code
            description: Verification code response
        base.v1.ConfigItem:
            type: object
            properties:
                id:
                    type: string
                    description: Configuration ID
                key:
                    type: string
                    description: configuration key
                value:
                    type: string
                    description: configure value
            description: System configuration item
        base.v1.CreateAiSessionBranchRequest:

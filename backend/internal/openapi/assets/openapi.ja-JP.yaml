components:
    schemas:
        base.v1.AiAction:
            type: object
            properties:
                flow:
                    type: string
                    description: フロー識別子
                step:
                    type: string
                    description: フローステップ
                type:
                    type: string
                    description: 动作種類
                payload_json:
                    type: string
                    description: アクションペイロード JSON
                source_message_id:
                    type: string
                    description: 动作ソースメッセージ ID
                action_id:
                    type: string
                    description: 一意なアクション ID
                flow_version:
                    type: string
                    description: 流程ステータスバージョン
            description: AI アシスタント动作
        base.v1.AiApprovalTool:
            type: object
            properties:
                name:
                    type: string
                    description: ツール名
                title:
                    type: string
                    description: 操作説明
                arguments:
                    type: string
                    description: 待実行の冻结パラメータJSON
            description: AI 待确认ツール呼び出し。
        base.v1.AiAttachment:
            type: object
            properties:
                id:
                    type: string
                    description: 添付ファイルID
                name:
                    type: string
                    description: 添付ファイル名称
                size:
                    type: string
                    description: 添付ファイル大小
                url:
                    type: string
                    description: 添付ファイルアドレス
                mime_type:
                    type: string
                    description: 添付ファイル MIME 種類
            description: AI アシスタント添付ファイル
        base.v1.AiAutomation:
            type: object
            properties:
                id:
                    type: string
                    description: タスク ID
                configuration:
                    $ref: '#/components/schemas/base.v1.AiAutomationForm'
                status:
                    type: string
                    description: active paused archived
                revision:
                    type: string
                    description: 設定バージョン
                next_fire_at:
                    type: string
                    description: 次回の実行日時（UTC）
                    format: date-time
                active_run_id:
                    type: string
                    description: 現在実行中の処理
                last_run:
                    $ref: '#/components/schemas/base.v1.AiAutomationRun'
                problem:
                    type: string
                    description: 対応が必要な依存関係の問題
                created_at:
                    type: string
                    description: 作成時刻
                    format: date-time
                updated_at:
                    type: string
                    description: 更新時刻
                    format: date-time
            description: 本人の自動化スケジュール。
        base.v1.AiAutomationForm:
            type: object
            properties:
                name:
                    type: string
                    description: 名称
                prompt:
                    type: string
                    description: 明確なタスクの指示
                schedule:
                    $ref: '#/components/schemas/base.v1.AiAutomationSchedule'
                provider_id:
                    type: string
                    description: 固定モデルのプロバイダー
                model_name:
                    type: string
                    description: 固定モデル名
                knowledge_base_ids:
                    type: array
                    items:
                        type: string
                    description: ナレッジベースの参照
                plugins:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiPluginSelection'
                    description: 選択したプラグインと確定したアカウント
            description: ユーザーが確認して保存した自動化設定。
        base.v1.AiAutomationRun:
            type: object
            properties:
                id:
                    type: string
                    description: 実行ID
                automation_id:
                    type: string
                    description: タスク ID
                revision:
                    type: string
                    description: 固定された設定のバージョン
                configuration:
                    $ref: '#/components/schemas/base.v1.AiAutomationForm'
                terminal:
                    type: string
                    description: 実行端末
                trigger:
                    type: string
                    description: scheduled manual
                scheduled_for:
                    type: string
                    description: スケジュールの実行枠
                    format: date-time
                status:
                    type: string
                    description: 実行ステータス
                session_id:
                    type: string
                    description: 独立した結果の会話
                summary:
                    type: string
                    description: 安全に表示できる結果の概要
                error_code:
                    type: string
                    description: エラーの理由
                result_unknown:
                    type: boolean
                    description: ツール呼び出しの結果が不明かどうか
                session_deleted:
                    type: boolean
                    description: 結果の会話が削除済みかどうか
                cancel_requested:
                    type: boolean
                    description: 停止が要求されているかどうか
                started_at:
                    type: string
                    description: 开始時刻
                    format: date-time
                finished_at:
                    type: string
                    description: 完成時刻
                    format: date-time
                created_at:
                    type: string
                    description: 記録時刻
                    format: date-time
            description: 固定された設定に基づく実行記録。
        base.v1.AiAutomationSchedule:
            type: object
            properties:
                frequency:
                    type: string
                    description: daily weekdays weekly once
                weekdays:
                    type: array
                    items:
                        type: integer
                        format: int32
                    description: 毎週の実行曜日。1は月曜日、7は日曜日
                time:
                    type: string
                    description: ローカル時刻。形式はHH:mm
                once_at:
                    type: string
                    description: 一度限りのローカル実行日時。形式はYYYY-MM-DDTHH:mm
                timezone:
                    type: string
                    description: IANAタイムゾーン
            description: 構造化されたローカル時刻のスケジュール。
        base.v1.AiFile:
            type: object
            properties:
                id:
                    type: string
                    description: ファイル ID
                tenant_id:
                    type: string
                    description: テナント ID
                source_type:
                    type: string
                    description: ソース：upload、generated
                status:
                    type: string
                    description: ステータス：active、trashed
                file_name:
                    type: string
                    description: 元のファイル名
                extension:
                    type: string
                    description: ファイル拡張子
                mime_type:
                    type: string
                    description: ファイルMIME種類
                size:
                    type: string
                    description: "ファイルサイズ，単位: バイト"
                link_url:
                    type: string
                    description: ファイルアクセスアドレス
                content_hash:
                    type: string
                    description: ファイル内容SHA-256ハッシュ
                access_mode:
                    type: integer
                    description: ファイルアクセス方式：1 公開、2 アクセストークン必須
                    format: int32
                created_at:
                    type: string
                    description: 作成時刻
                    format: date-time
                updated_at:
                    type: string
                    description: 更新時刻
                    format: date-time
            description: AI ファイルメタデータ。
        base.v1.AiInputContent:
            type: object
            properties:
                kind:
                    type: string

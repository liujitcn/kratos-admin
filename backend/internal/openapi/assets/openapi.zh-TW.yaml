components:
    schemas:
        base.v1.AiAction:
            type: object
            properties:
                flow:
                    type: string
                    description: 流程標識
                step:
                    type: string
                    description: 流程步驟
                type:
                    type: string
                    description: 動作型別
                payload_json:
                    type: string
                    description: 動作負載JSON
                source_message_id:
                    type: string
                    description: 動作來源訊息ID
                action_id:
                    type: string
                    description: 動作唯一ID
                flow_version:
                    type: string
                    description: 流程狀態版本
            description: AI 助手動作
        base.v1.AiAttachment:
            type: object
            properties:
                id:
                    type: string
                    description: 附件ID
                name:
                    type: string
                    description: 附件名稱
                size:
                    type: string
                    description: 附件大小
                url:
                    type: string
                    description: 附件地址
                mime_type:
                    type: string
                    description: 附件 MIME 型別
            description: AI 助手附件
        base.v1.AiInputContent:
            type: object
            properties:
                kind:
                    type: string
                    description: 內容型別
                content:
                    type: string
                    description: 內容正文
            description: AI 助手輸入內容
        base.v1.AiMessage:
            type: object
            properties:
                id:
                    type: string
                    description: 訊息ID
                input_content:
                    $ref: '#/components/schemas/base.v1.AiInputContent'
                output_content:
                    $ref: '#/components/schemas/base.v1.AiOutputContent'
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/base.v1.AiAttachment'
                    description: 附件列表
                created_at:
                    type: string
                    description: 建立時間
                    format: date-time
                status:
                    enum:

server:
  http:
    addr: :7001
    max_body_bytes: 67108864
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_validate: true
      enable_metadata: true
  grpc:
    addr: 0.0.0.0:6001
    timeout: 10s
    middleware:
      enable_recovery: true
      enable_logging: true
      enable_tracing: true
      enable_validate: true
      enable_metadata: true
  mcp:
    transport: IN_PROCESS
    path: /mcp
  sse:
    transport: IN_PROCESS
    path: /events
    codec: json
    event_ttl: 300s
    auto_stream: true
    auto_reply: true

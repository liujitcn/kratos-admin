oss:
  type: local
  root_directory: ./data

  aliyun:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    access_key_id: xxx
    access_key_secret: xxx
    bucket_name: xxx

  # 多实例部署可将 type 改为 minio 或 s3，并通过环境覆盖以下凭据。
  minio:
    endpoint: http://127.0.0.1:9000
    access_key: minioadmin
    secret_key: minioadmin
    bucket_name: kratos-admin
    use_ssl: false

  s3:
    endpoint: http://127.0.0.1:9000
    region: us-east-1
    access_key: minioadmin
    secret_key: minioadmin
    bucket_name: kratos-admin
    use_ssl: false
    force_path_style: true

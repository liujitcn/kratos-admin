# 多因素认证完整配置模板。
# 加密密钥、TOTP 和 WebAuthn 参数会影响已注册认证器，生产环境修改前应评估兼容性。
mfa:
    # MFA 敏感数据加密密钥，要求为 Base64 编码的 32 字节密钥。
    encryption_key: ''
    # 登录挑战有效期；300s 表示 5 分钟。
    login_challenge_expire: 300s
    # 单次登录挑战允许的最大失败次数。
    login_max_attempts: 5
    # 每次生成的恢复码数量。
    recovery_code_count: 10
    # 单个恢复码长度。
    recovery_code_length: 10
    # MFA 绑定票据有效期；600s 表示 10 分钟。
    setup_ticket_expire: 600s
    totp:
        # TOTP 哈希算法；常用值为 SHA1、SHA256、SHA512。
        algorithm: SHA1
        # 动态口令位数；当前为 6 位。
        digits: 6
        # 验证器中显示的发行方名称。
        issuer: Kratos Admin
        # 单个 TOTP 口令有效周期，单位秒。
        period: 30
        # TOTP 密钥长度，单位字节。
        secret_size: 20
        # 允许的时间窗口偏移；1 表示允许相邻一个周期。
        skew: 1
    webauthn:
        # WebAuthn 依赖方 ID；生产环境应配置为业务域名。
        rp_id: localhost
        # 允许发起 WebAuthn ceremony 的来源列表，必须包含协议和端口。
        rp_origins:
            - http://localhost:5173

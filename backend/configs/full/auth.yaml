# 认证与会话完整配置模板。
authn:
  jwt:
    # JWT 签名算法，例如 HS256；必须与签发端和校验端保持一致。
    method: HS256
    # JWT 签名密钥；生产环境不得使用空值，应通过安全配置注入。
    secret: ''
    # 访问令牌有效期；使用 Go/Protobuf duration 格式，3600s 表示 1 小时。
    access_token_expires: 3600s

    # 可选认证规则：匹配到的接口允许匿名访问，但携带令牌时仍会尝试解析用户。
    refresh_token_expires: 2592000s

    optional_auth:
      match:
        # 使用框架 operation 名称匹配，格式为 /{protobuf service}/{method}。
        - /system.app.v1.BaseMenuService/ListBaseMenu
      # 按完整 HTTP/gRPC 路径匹配；当前未使用。
      path: []
      # 按路径前缀匹配；当前未使用。
      prefix: []
      # 按正则表达式匹配；当前未使用。
      regex: []
    # 刷新令牌有效期；2592000s 表示 30 天。

    # 强制免认证白名单；匹配到的接口不会要求有效 JWT。
    white_list:
      match:
        # 以下 match 均使用框架 operation 名称匹配。
        - /base.v1.ConfigService/GetConfig
        - /base.v1.LoginService/Captcha
        - /base.v1.LoginService/VerifyCaptcha
        - /base.v1.LoginService/PasswordPublicKey
        - /base.v1.LoginService/RefreshToken
        - /base.v1.MfaService/VerifyMfa
        - /base.v1.MfaService/BeginMfaEnrollment
        - /base.v1.MfaService/ConfirmMfaEnrollment
        - /base.v1.LoginService/Login
        - /base.v1.OauthService/ListOauthProvider
        - /base.v1.OauthService/CreateOauthAuthorization
        - /base.v1.OauthService/HandleOauthCallback
        - /base.v1.OauthService/ExchangeOauthTicket
        - /base.v1.OauthService/CreateOauthSession
        - /base.v1.OauthService/BindOauthSession
        - /base.v1.OauthService/HandleOauthBindingCallback
        - /base.v1.OauthClientService/IssueOauthClientToken
        - /base.v1.LanguageService/OptionLanguage
      # 按完整 HTTP/gRPC 路径匹配；当前未使用。
      path: []
      # 按路径前缀匹配；当前未使用。
      prefix: []
      # 按正则表达式匹配；当前未使用。
      regex: []

  # 服务端会话生命周期配置；时间使用 Go/Protobuf duration 格式。
  session:
    # 会话无请求活动达到此时长后失效；1800s 表示 30 分钟。
    idle_timeout: 1800s
    # 会话从创建开始允许存在的最长时间；43200s 表示 12 小时。
    max_lifetime: 43200s

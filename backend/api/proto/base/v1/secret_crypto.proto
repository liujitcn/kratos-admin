syntax = "proto3";

package base.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

// 敏感字段加密公共服务
service SecretCryptoService {
  // 获取敏感字段临时公钥，同一次提交的多个密文字段共用该公钥
  rpc GetSecretPublicKey(GetSecretPublicKeyRequest) returns (GetSecretPublicKeyResponse) {
    option (google.api.http) = {
      get: "/api/v1/base/secret-public-key"
    };
  }

  // 查看密钥字段明文，仅允许查询注册过的密钥字段
  rpc RevealSecretField(RevealSecretFieldRequest) returns (RevealSecretFieldResponse) {
    option (google.api.http) = {
      post: "/api/v1/base/secret-field/reveal"
      body: "*"
    };
  }
}

// 敏感字段临时公钥获取条件
message GetSecretPublicKeyRequest {}

// 敏感字段临时公钥响应
message GetSecretPublicKeyResponse {
  string key_id = 1 [(gnostic.openapi.v3.property) = {description: "临时密钥ID"}]; // 临时密钥ID

  string public_key = 2 [(gnostic.openapi.v3.property) = {description: "临时公钥"}]; // 临时公钥

  string algorithm = 3 [(gnostic.openapi.v3.property) = {description: "加密算法"}]; // 加密算法

  string nonce = 4 [(gnostic.openapi.v3.property) = {description: "随机值"}]; // 随机值

  int64 expires_in = 5 [(gnostic.openapi.v3.property) = {description: "有效时间，单位秒"}]; // 有效时间，单位秒
}

// 密钥字段查看条件
message RevealSecretFieldRequest {
  string resource = 1 [(gnostic.openapi.v3.property) = {description: "密钥字段资源标识"}, (buf.validate.field).cel = {id: "base.v1.secret_crypto.reveal.resource.required" message: "资源标识不能为空" expression: "this.size() > 0 && this.size() <= 64"}]; // 资源标识，如 ai_provider、base_oauth_provider、base_message_provider

  int64 id = 2 [(gnostic.openapi.v3.property) = {description: "记录ID"}, (buf.validate.field).int64 = {gt: 0}]; // 记录ID

  string field = 3 [(gnostic.openapi.v3.property) = {description: "密钥字段名"}, (buf.validate.field).cel = {id: "base.v1.secret_crypto.reveal.field.required" message: "字段名不能为空" expression: "this.size() > 0 && this.size() <= 64"}]; // 字段名，如 api_key、client_secret
}

// 密钥字段查看响应
message RevealSecretFieldResponse {
  string text = 1 [(gnostic.openapi.v3.property) = {description: "密钥明文"}]; // 密钥明文
}

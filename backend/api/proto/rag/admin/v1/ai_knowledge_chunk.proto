syntax = "proto3";

package rag.admin.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

// AI知识库切片检索服务。
service AiKnowledgeChunkService {
  // 检索测试：返回与query语义最相近的切片。
  rpc SearchAiKnowledge(SearchAiKnowledgeRequest) returns (SearchAiKnowledgeResponse) {
    option (google.api.http) = {post: "/api/v1/admin/rag/knowledge/{id}/search" body: "*"};
  }
}

// 检索测试请求。
message SearchAiKnowledgeRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "知识库ID"}, (buf.validate.field).int64 = {gt: 0}]; // 知识库ID
  string query = 2 [(gnostic.openapi.v3.property) = {description: "检索关键词"}, (buf.validate.field).cel = {id: "rag.admin.ai.knowledge.search.query.required" message: "请输入检索内容" expression: "this.size() > 0 && this.size() <= 1000"}]; // 检索关键词
  int32 top_k = 3 [(gnostic.openapi.v3.property) = {description: "返回切片数量", default: {number: 5}}, (buf.validate.field).int32 = {gte: 1, lte: 20}]; // 返回切片数量
}

// 检索测试响应。
message SearchAiKnowledgeResponse {
  repeated AiKnowledgeChunkHit hits = 1 [(gnostic.openapi.v3.property) = {description: "语义最相近的切片"}]; // 语义最相近的切片
}

// 检索命中的切片。
message AiKnowledgeChunkHit {
  int64 chunk_id = 1 [(gnostic.openapi.v3.property) = {description: "切片ID"}]; // 切片ID
  int64 doc_id = 2 [(gnostic.openapi.v3.property) = {description: "文档ID"}]; // 文档ID
  string doc_name = 3 [(gnostic.openapi.v3.property) = {description: "文档名称"}]; // 文档名称
  string content = 4 [(gnostic.openapi.v3.property) = {description: "切片文本"}]; // 切片文本
  float score = 5 [(gnostic.openapi.v3.property) = {description: "余弦相似度"}]; // 余弦相似度
}

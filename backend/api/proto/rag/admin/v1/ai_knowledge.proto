syntax = "proto3";

package rag.admin.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// AI知识库管理服务。
service AiKnowledgeService {
  // 分页查询AI知识库。
  rpc PageAiKnowledge(PageAiKnowledgeRequest) returns (PageAiKnowledgeResponse) {
    option (google.api.http) = {get: "/api/v1/admin/rag/knowledge"};
  }
  // 查询已启用的embedding模型选项（知识库向量化模型下拉）。
  // 字面路径必须先于 /{id} 声明：gorilla mux 按注册顺序匹配，否则会被 {id} 路由抢占。
  rpc ListAiKnowledgeModels(ListAiKnowledgeModelsRequest) returns (ListAiKnowledgeModelsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/rag/knowledge/models"};
  }
  // 查询AI知识库表单。
  rpc GetAiKnowledge(GetAiKnowledgeRequest) returns (AiKnowledgeForm) {
    option (google.api.http) = {get: "/api/v1/admin/rag/knowledge/{id}"};
  }
  // 创建AI知识库。
  rpc CreateAiKnowledge(CreateAiKnowledgeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/v1/admin/rag/knowledge" body: "ai_knowledge"};
  }
  // 更新AI知识库。
  rpc UpdateAiKnowledge(UpdateAiKnowledgeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {put: "/api/v1/admin/rag/knowledge/{ai_knowledge.id}" body: "ai_knowledge"};
  }
  // 删除AI知识库（级联删除文档与切片）。
  rpc DeleteAiKnowledge(DeleteAiKnowledgeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/admin/rag/knowledge/{id}"};
  }
}

// AI知识库分页查询条件。
message PageAiKnowledgeRequest {
  string name = 1 [(gnostic.openapi.v3.property) = {description: "知识库名称"}]; // 知识库名称
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页行数
}

// AI知识库分页响应。
message PageAiKnowledgeResponse {
  repeated AiKnowledge knowledges = 1 [(gnostic.openapi.v3.property) = {description: "知识库列表"}]; // 知识库列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询AI知识库请求。
message GetAiKnowledgeRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "知识库ID"}, (buf.validate.field).int64 = {gt: 0}]; // 知识库ID
}

// AI知识库维护表单。
message AiKnowledgeForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "知识库ID"}]; // 知识库ID
  string name = 2 [(gnostic.openapi.v3.property) = {description: "知识库名称"}, (buf.validate.field).cel = {id: "rag.admin.ai.knowledge.name.required" message: "请输入知识库名称" expression: "this.size() > 0 && this.size() <= 100"}]; // 知识库名称
  string description = 3 [(gnostic.openapi.v3.property) = {description: "描述"}, (buf.validate.field).cel = {id: "rag.admin.ai.knowledge.description.max_length" message: "描述不能超过500个字符" expression: "this.size() <= 500"}]; // 描述
  int32 embedding_dimensions = 4 [(gnostic.openapi.v3.property) = {description: "向量维度；0表示按所选模型配置或系统默认"}]; // 向量维度；0表示按所选模型配置或系统默认
  int64 model_id = 5 [(gnostic.openapi.v3.property) = {description: "向量化使用的embedding模型ID"}, (buf.validate.field).int64 = {gt: 0}]; // 向量化使用的embedding模型ID
}

// 创建AI知识库请求。
message CreateAiKnowledgeRequest {
  AiKnowledgeForm ai_knowledge = 1 [(gnostic.openapi.v3.property) = {description: "AI知识库表单"}, (buf.validate.field).required = true]; // AI知识库表单
}

// 更新AI知识库请求。
message UpdateAiKnowledgeRequest {
  option (buf.validate.message).cel = {id: "rag.admin.ai.knowledge.update.id.required" message: "知识库ID不能为空" expression: "this.ai_knowledge.id > 0"};
  AiKnowledgeForm ai_knowledge = 1 [(gnostic.openapi.v3.property) = {description: "AI知识库表单"}, (buf.validate.field).required = true]; // AI知识库表单
}

// 删除AI知识库请求。
message DeleteAiKnowledgeRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "知识库ID"}, (buf.validate.field).int64 = {gt: 0}]; // 知识库ID
}

// AI知识库分页记录。
message AiKnowledge {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "知识库ID"}]; // 知识库ID
  string name = 2 [(gnostic.openapi.v3.property) = {description: "知识库名称"}]; // 知识库名称
  string description = 3 [(gnostic.openapi.v3.property) = {description: "描述"}]; // 描述
  string provider_name = 4 [(gnostic.openapi.v3.property) = {description: "embedding模型所属供应商名称"}]; // embedding模型所属供应商名称
  int32 embedding_dimensions = 5 [(gnostic.openapi.v3.property) = {description: "embedding向量维度"}]; // embedding向量维度
  int64 model_id = 6 [(gnostic.openapi.v3.property) = {description: "向量化使用的embedding模型ID"}]; // 向量化使用的embedding模型ID
  string model_name = 7 [(gnostic.openapi.v3.property) = {description: "embedding模型名称"}]; // embedding模型名称
  int32 doc_count = 8 [(gnostic.openapi.v3.property) = {description: "文档数量"}]; // 文档数量
  string created_at = 9 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 10 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 查询embedding模型选项请求。
message ListAiKnowledgeModelsRequest {}

// 查询embedding模型选项响应。
message ListAiKnowledgeModelsResponse {
  repeated AiKnowledgeModel models = 1 [(gnostic.openapi.v3.property) = {description: "已启用的embedding模型列表"}]; // 已启用的embedding模型列表
}

// 知识库可用的embedding模型选项。
message AiKnowledgeModel {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "模型ID"}]; // 模型ID
  string provider_name = 2 [(gnostic.openapi.v3.property) = {description: "模型所属供应商名称"}]; // 模型所属供应商名称
  string model_name = 3 [(gnostic.openapi.v3.property) = {description: "模型名称"}]; // 模型名称
  string display_name = 4 [(gnostic.openapi.v3.property) = {description: "显示名称"}]; // 显示名称
  int32 dimensions = 5 [(gnostic.openapi.v3.property) = {description: "模型声明的输出向量维度；0表示未声明"}]; // 模型声明的输出向量维度；0表示未声明
  repeated int32 dimension_options = 6 [(gnostic.openapi.v3.property) = {description: "可选向量维度列表"}]; // 可选向量维度列表
}

syntax = "proto3";

package system.admin.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Admin国际化翻译信息服务。
service BaseI18nService {
  // 翻译单个文本。
  rpc DraftBaseI18n(DraftBaseI18nRequest) returns (DraftBaseI18nResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/base/i18n/draft"
      body: "*"
    };
  }

  // 修改国际化翻译信息
  rpc UpdateBaseI18n(UpdateBaseI18nRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/i18n"
      body: "*"
    };
  }
}

// 翻译单个文本请求。
message DraftBaseI18nRequest {
  string source = 1 [
    (gnostic.openapi.v3.property) = {description: "待翻译文本"},
    (buf.validate.field).cel = {id: "system.admin.base.i18n.draft.source.required" message: "待翻译文本不能为空" expression: "this.size() > 0"}
  ]; // 待翻译文本

  optional string locale = 2 [(gnostic.openapi.v3.property) = {description: "目标语言区域，不传时翻译所有启用的非主语言"}]; // 目标语言区域，不传时翻译所有启用的非主语言
}

// 翻译单个文本响应。
message DraftBaseI18nResponse {
  repeated DraftBaseI18nItem i18ns = 1 [(gnostic.openapi.v3.property) = {description: "翻译结果"}]; // 翻译结果
}

// 翻译单个文本响应。
message DraftBaseI18nItem {
  string locale = 1 [(gnostic.openapi.v3.property) = {description: "目标语言区域"}]; // 目标语言区域
  string i18n = 2 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本
}


// 修改单个翻译信息请求。
message UpdateBaseI18nRequest {
  option (buf.validate.message).cel = {
    id: "system.admin.base.i18n.update.target.required"
    message: "ID为零时必须提供完整目标信息"
    expression: "this.id >= 0 && (this.id > 0 || (this.target_key.size() > 0 && this.target_key.size() <= 128 && this.target_key.split('.').size() >= 2 && this.target_key.split('.').all(segment, segment.matches('^[a-z][a-z0-9_]*$')) && this.target_id > 0 && this.locale.size() > 0))"
  };

  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "翻译记录ID，大于零时优先按ID更新；ID不存在时根据目标信息更新或新增"}]; // 翻译记录ID，大于零时优先按ID更新；ID不存在时根据目标信息更新或新增

  string target_key = 2 [(gnostic.openapi.v3.property) = {description: "翻译目标键"}]; // 翻译目标键，格式为表名.字段名

  int64 target_id = 3 [(gnostic.openapi.v3.property) = {description: "目标资源ID，ID为零时用于查询或新增"}]; // 目标资源ID，ID为零时用于查询或新增

  string locale = 4 [(gnostic.openapi.v3.property) = {description: "目标语言区域，ID为零时用于查询或新增"}]; // 目标语言区域，ID为零时用于查询或新增

  string name = 5 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本
}


// 国际化翻译信息
message BaseI18n {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "主键ID"}]; // 翻译记录ID
  string target_key = 2 [(gnostic.openapi.v3.property) = {description: "翻译目标键"}]; // 翻译目标键，格式为表名.字段名
  int64 target_id = 3 [(gnostic.openapi.v3.property) = {description: "目标ID"}]; // 目标资源ID
  string locale = 4 [(gnostic.openapi.v3.property) = {description: "语言区域"}]; // 语言区域
  string name = 5 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本

}

// 代码生成单语言国际化配置
message CodeGenLocaleConfig {
  string comment = 1 [(gnostic.openapi.v3.property) = {description: "业务或字段描述"}]; // 业务或字段描述

  string left_tree_comment = 2 [(gnostic.openapi.v3.property) = {description: "左树描述"}]; // 左树描述
}

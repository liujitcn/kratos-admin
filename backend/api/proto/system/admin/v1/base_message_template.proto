syntax = "proto3";

package system.admin.v1;

import "base/v1/notification.proto";
import "buf/validate/validate.proto";
import "common/v1/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Admin消息 Provider 模板管理服务。
service BaseMessageTemplateService {
  // 分页查询消息 Provider 模板。
  rpc PageBaseMessageTemplate(PageBaseMessageTemplateRequest) returns (PageBaseMessageTemplateResponse) { option (google.api.http) = {get: "/api/v1/admin/base/message-template"}; }
  // 查询消息 Provider 模板详情。
  rpc GetBaseMessageTemplate(GetBaseMessageTemplateRequest) returns (BaseMessageTemplateForm) { option (google.api.http) = {get: "/api/v1/admin/base/message-template/{id}"}; }
  // 创建消息 Provider 模板。
  rpc CreateBaseMessageTemplate(CreateBaseMessageTemplateRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/api/v1/admin/base/message-template" body: "base_message_template"}; }
  // 更新消息 Provider 模板。
  rpc UpdateBaseMessageTemplate(UpdateBaseMessageTemplateRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message-template/{base_message_template.id}" body: "base_message_template"}; }
  // 删除消息 Provider 模板。
  rpc DeleteBaseMessageTemplate(DeleteBaseMessageTemplateRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/message-template/{id}"}; }
}

// 消息 Provider 模板分页查询条件。
message PageBaseMessageTemplateRequest {
  optional int64 category_id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  optional int64 provider_id = 2 [(gnostic.openapi.v3.property) = {description: "消息 Provider ID"}]; // 消息 Provider ID
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页数量
}

// 消息 Provider 模板分页响应。
message PageBaseMessageTemplateResponse {
  repeated BaseMessageTemplate base_message_templates = 1 [(gnostic.openapi.v3.property) = {description: "消息 Provider 模板列表"}]; // 消息 Provider 模板列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 消息 Provider 模板详情查询条件。
message GetBaseMessageTemplateRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息模板ID"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.get.id.required" message: "消息模板ID不能为空" expression: "this > 0"}]; // 消息模板ID
}

// 创建消息 Provider 模板请求。
message CreateBaseMessageTemplateRequest {
  BaseMessageTemplateForm base_message_template = 1 [(gnostic.openapi.v3.property) = {description: "消息 Provider 模板表单"}, (buf.validate.field).required = true]; // 消息 Provider 模板表单
}

// 更新消息 Provider 模板请求。
message UpdateBaseMessageTemplateRequest {
  BaseMessageTemplateForm base_message_template = 1 [(gnostic.openapi.v3.property) = {description: "消息 Provider 模板表单"}, (buf.validate.field).required = true]; // 消息 Provider 模板表单
}

// 删除消息 Provider 模板请求。
message DeleteBaseMessageTemplateRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "消息模板ID列表"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.delete.id.required" message: "消息模板ID列表不能为空" expression: "this.size() > 0"}]; // 消息模板ID列表
}

// 消息 Provider 模板表单。
message BaseMessageTemplateForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息模板ID"}]; // 消息模板ID
  int64 category_id = 2 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.form.category_id.required" message: "消息分类不能为空" expression: "this > 0"}]; // 消息分类ID
  int64 provider_id = 3 [(gnostic.openapi.v3.property) = {description: "消息 Provider ID"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.form.provider_id.required" message: "消息 Provider 不能为空" expression: "this > 0"}]; // 消息 Provider ID
  string title = 4 [(gnostic.openapi.v3.property) = {description: "模板标题"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.form.title.length" message: "模板标题不能为空且不能超过200个字符" expression: "this.size() > 0 && this.size() <= 200"}]; // 模板标题
  string content = 5 [(gnostic.openapi.v3.property) = {description: "模板正文"}, (buf.validate.field).cel = {id: "system.admin.base_message_template.form.content.length" message: "模板正文不能超过20000个字符" expression: "this.size() <= 20000"}]; // 模板正文
  .base.v1.MessageContentFormat content_format = 6 [(gnostic.openapi.v3.property) = {description: "正文格式"}, (buf.validate.field).enum = {defined_only: true}]; // 正文格式
  google.protobuf.Struct config = 7 [(gnostic.openapi.v3.property) = {description: "Provider模板扩展配置JSON对象"}]; // Provider模板扩展配置JSON对象
}

// 消息 Provider 模板。
message BaseMessageTemplate {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息模板ID"}]; // 消息模板ID
  int64 category_id = 2 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  string category_name = 3 [(gnostic.openapi.v3.property) = {description: "消息分类名称"}]; // 消息分类名称
  int64 provider_id = 4 [(gnostic.openapi.v3.property) = {description: "消息 Provider ID"}]; // 消息 Provider ID
  string provider_name = 5 [(gnostic.openapi.v3.property) = {description: "消息 Provider 名称"}]; // 消息 Provider 名称
  string title = 6 [(gnostic.openapi.v3.property) = {description: "模板标题"}]; // 模板标题
  string content = 7 [(gnostic.openapi.v3.property) = {description: "模板正文"}]; // 模板正文
  .base.v1.MessageContentFormat content_format = 8 [(gnostic.openapi.v3.property) = {description: "正文格式"}]; // 正文格式
  google.protobuf.Struct config = 9 [(gnostic.openapi.v3.property) = {description: "Provider模板扩展配置JSON对象"}]; // Provider模板扩展配置JSON对象
  string created_at = 100 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 101 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

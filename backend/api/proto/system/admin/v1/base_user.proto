syntax = "proto3";

package system.admin.v1;

import "common/v1/common.proto";
import "common/v1/analytics.proto";
import "common/v1/enum.proto";
import "common/v1/types.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// Admin用户管理服务
service BaseUserService {
  // 查询用户下拉选择
  rpc OptionBaseUser(OptionBaseUserRequest) returns (.common.v1.SelectOptionResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/user/option"
    };
  }

  // 查询用户列表
  rpc ListBaseUser(ListBaseUserRequest) returns (ListBaseUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/user/list"
    };
  }

  // 查询用户分页列表
  rpc PageBaseUser(PageBaseUserRequest) returns (PageBaseUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/user"
    };
  }

  // 查询用户
  rpc GetBaseUser(GetBaseUserRequest) returns (BaseUserForm) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/user/{id}"
    };
  }

  // 创建用户
  rpc CreateBaseUser(CreateBaseUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/base/user"
      body: "base_user"
    };
  }

  // 更新用户
  rpc UpdateBaseUser(UpdateBaseUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/user/{base_user.id}"
      body: "base_user"
    };
  }

  // 删除用户
  rpc DeleteBaseUser(DeleteBaseUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/admin/base/user/{id}"
    };
  }

  // 设置状态
  rpc SetBaseUserStatus(SetBaseUserStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/user/{id}/status"
      body: "*"
    };
  }

  // 重置密码
  rpc ResetBaseUserPassword(ResetBaseUserPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/user/{id}/password"
      body: "*"
    };
  }

  // 设置基础用户应用端角色
  rpc SetBaseUserAppRole(SetBaseUserAppRoleRequest) returns (google.protobuf.Empty);

  // 汇总用户注册数据
  rpc SummaryBaseUser(SummaryBaseUserRequest) returns (SummaryBaseUserResponse);
}

// 用户性别。
enum BaseUserGender {
  // 未指定用户性别。
  BASE_USER_GENDER_UNSPECIFIED = 0;
  // 保密。
  BASE_USER_GENDER_SECRET = 1;
  // 男。
  BASE_USER_GENDER_MALE = 2;
  // 女。
  BASE_USER_GENDER_FEMALE = 3;
}

// 用户选项查询条件
message OptionBaseUserRequest {
  string keyword = 1 [(gnostic.openapi.v3.property) = {description: "关键字"}]; // 关键字

  optional int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
}

// 用户列表查询条件
message ListBaseUserRequest {
  repeated int64 ids = 1 [(gnostic.openapi.v3.property) = {description: "用户ID列表"}, (buf.validate.field).repeated = {min_items: 1, unique: true}, (buf.validate.field).cel = {id: "system.admin.base.user.list.ids.positive" message: "用户ID必须大于0" expression: "this.all(item, item > 0)"}]; // 用户ID列表
}

// 用户列表响应
message ListBaseUserResponse {
  repeated BaseUser base_users = 1 [(gnostic.openapi.v3.property) = {description: "用户列表"}]; // 用户列表
}

// 用户分页查询条件
message PageBaseUserRequest {
  string user_code = 1 [(gnostic.openapi.v3.property) = {description: "用户编号"}]; // 用户编号

  string user_name = 2 [(gnostic.openapi.v3.property) = {description: "用户账号"}]; // 用户账号

  string nick_name = 3 [(gnostic.openapi.v3.property) = {description: "用户昵称"}]; // 用户昵称

  optional int64 tenant_id = 4 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  optional int64 dept_id = 5 [(gnostic.openapi.v3.property) = {description: "部门ID"}]; // 部门ID

  string phone = 6 [(gnostic.openapi.v3.property) = {description: "手机号"}]; // 手机号

  optional BaseUserGender gender = 7 [(gnostic.openapi.v3.property) = {description: "性别"}]; // 性别

  optional .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  int64 page_num = 101 [(gnostic.openapi.v3.property) = {
    description: "当前页码"
    default: {number: 1}
  }]; // 当前页码

  int64 page_size = 102 [(gnostic.openapi.v3.property) = {
    description: "每一页的行数"
    default: {number: 10}
  }]; // 每一页的行数
}

// 用户分页响应
message PageBaseUserResponse {
  repeated BaseUser base_users = 1 [(gnostic.openapi.v3.property) = {description: "分页数据"}]; // 分页数据

  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询用户请求参数
message GetBaseUserRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.get.id.required" message: "用户ID不能为空" expression: "this > 0"}]; // 用户ID
}

// 创建用户请求参数
message CreateBaseUserRequest {
  option (buf.validate.message).cel = {
    id: "system.admin.base.user.create.pwd.required"
    message: "请输入密码"
    expression: "!has(this.base_user) || has(this.base_user.pwd)"
  };

  BaseUserForm base_user = 1 [(gnostic.openapi.v3.property) = {description: "用户表单"}, (buf.validate.field).required = true]; // 用户表单
}

// 更新用户请求参数
message UpdateBaseUserRequest {
  option (buf.validate.message).cel = {id: "system.admin.base.user.update.id.required" message: "用户ID不能为空" expression: "this.base_user.id > 0"};

  BaseUserForm base_user = 1 [(gnostic.openapi.v3.property) = {description: "用户表单"}, (buf.validate.field).required = true]; // 用户表单
}

// 删除用户请求参数
message DeleteBaseUserRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.user.delete.id.required" message: "用户ID列表不能为空" expression: "this.size() > 0"}]; // 用户ID列表
}

// 设置用户状态请求参数
message SetBaseUserStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.set_status.id.required" message: "用户ID不能为空" expression: "this > 0"}]; // 用户ID

  int32 status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
}

// 用户
message BaseUser {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.reset_password.id.required" message: "用户ID不能为空" expression: "this > 0"}]; // 用户ID

  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  string user_name = 3 [(gnostic.openapi.v3.property) = {description: "用户账号"}]; // 用户账号

  string user_code = 11 [(gnostic.openapi.v3.property) = {description: "用户编号"}]; // 用户编号

  string nick_name = 4 [(gnostic.openapi.v3.property) = {description: "用户昵称"}]; // 用户昵称

  int64 role_id = 5 [(gnostic.openapi.v3.property) = {description: "角色ID"}]; // 角色ID

  int64 dept_id = 6 [(gnostic.openapi.v3.property) = {description: "部门ID"}]; // 部门ID

  int64 post_id = 7 [(gnostic.openapi.v3.property) = {description: "岗位ID"}]; // 岗位ID

  string phone = 8 [(gnostic.openapi.v3.property) = {description: "手机号"}]; // 手机号

  BaseUserGender gender = 9 [(gnostic.openapi.v3.property) = {description: "性别"}]; // 性别

  string avatar = 10 [(gnostic.openapi.v3.property) = {description: "头像"}]; // 头像

  .common.v1.Status status = 101 [(gnostic.openapi.v3.property) = {description: "用户状态"}]; // 用户状态

  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注名"}]; // 备注名

  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间

  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间

  bool is_protected = 300 [(gnostic.openapi.v3.property) = {description: "是否禁止通过用户管理操作"}]; // 是否禁止通过用户管理操作
}

// 用户表单
message BaseUserForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID

  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.tenant_id.required" message: "所属租户不能为空" expression: "this > 0"}]; // 租户ID

  string user_name = 3 [(gnostic.openapi.v3.property) = {description: "用户账号"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.user_name.length" message: "用户账号不能为空且不超过 50 个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 用户账号

  string user_code = 12 [(gnostic.openapi.v3.property) = {description: "用户编号"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.user_code.length" message: "用户编号不能为空且不超过 30 个字符" expression: "this.size() > 0 && this.size() <= 30"}]; // 用户编号

  string nick_name = 4 [(gnostic.openapi.v3.property) = {description: "用户昵称"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.nick_name.required" message: "用户昵称不能为空" expression: "this.size() > 0"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.nick_name.max_length" message: "用户昵称不能超过 30 个字符" expression: "this.size() <= 30"}]; // 用户昵称

  int64 role_id = 5 [(gnostic.openapi.v3.property) = {description: "角色ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.role_id.required" message: "角色不能为空" expression: "this > 0"}]; // 角色ID

  int64 dept_id = 6 [(gnostic.openapi.v3.property) = {description: "部门ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.dept_id.required" message: "部门不能为空" expression: "this > 0"}]; // 部门ID

  int64 post_id = 10 [(gnostic.openapi.v3.property) = {description: "岗位ID"}]; // 岗位ID

  string phone = 7 [(gnostic.openapi.v3.property) = {description: "手机号"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.phone.max_length" message: "手机号不能超过 20 个字符" expression: "this.size() <= 20"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.phone.format" message: "请输入正确的手机号码" expression: "this.size() == 0 || this.matches('^1[3-9]\\\\d{9}$')"}]; // 手机号

  string avatar = 8 [(gnostic.openapi.v3.property) = {description: "头像"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.avatar.max_length" message: "头像不能超过 1024 个字符" expression: "this.size() <= 1024"}]; // 头像

  BaseUserGender gender = 9 [(gnostic.openapi.v3.property) = {description: "性别"}, (buf.validate.field).enum = {defined_only: true}]; // 性别

  .common.v1.PasswordCrypto pwd = 300 [(gnostic.openapi.v3.property) = {description: "密码"}]; // 密码

  .common.v1.Status status = 101 [(gnostic.openapi.v3.property) = {description: "用户状态"}, (buf.validate.field).enum = {defined_only: true}]; // 用户状态

  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注名"}, (buf.validate.field).cel = {id: "system.admin.base.user.entity.remark.max_length" message: "备注不能超过 500 个字符" expression: "this.size() <= 500"}]; // 备注名
}

// 重置用户密码请求参数
message ResetBaseUserPasswordRequest {
  option (buf.validate.message).cel = {
    id: "system.admin.base.user.reset_password.reset_pwd.required"
    message: "请输入新密码"
    expression: "has(this.pwd)"
  };

  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID

  .common.v1.PasswordCrypto pwd = 2 [(gnostic.openapi.v3.property) = {description: "密码"}]; // 密码
}

// 基础用户应用端角色设置参数
message SetBaseUserAppRoleRequest {
  int64 user_id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}, (buf.validate.field).cel = {id: "system.admin.base.user.set_app_role.user_id.required" message: "用户ID不能为空" expression: "this > 0"}]; // 用户ID

  string role_code = 2 [(gnostic.openapi.v3.property) = {description: "应用端角色编码"}, (buf.validate.field).cel = {id: "system.admin.base.user.set_app_role.role_code.required" message: "应用端角色编码不能为空" expression: "this.size() > 0"}]; // 应用端角色编码
}

// 用户注册汇总查询条件
message SummaryBaseUserRequest {
  optional int64 tenant_id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  google.protobuf.Timestamp start_at = 2 [(gnostic.openapi.v3.property) = {description: "开始时间"}, (buf.validate.field).required = true]; // 开始时间

  google.protobuf.Timestamp end_at = 3 [(gnostic.openapi.v3.property) = {description: "结束时间"}, (buf.validate.field).required = true]; // 结束时间

  .common.v1.AnalyticsTimeType time_type = 4 [(gnostic.openapi.v3.property) = {description: "统计时间类型"}, (buf.validate.field).enum = {defined_only: true}]; // 统计时间类型
}

// 用户注册汇总响应
message SummaryBaseUserResponse {
  int64 total = 1 [(gnostic.openapi.v3.property) = {description: "用户总数"}]; // 用户总数

  repeated BaseUserSummaryItem summaries = 2 [(gnostic.openapi.v3.property) = {description: "用户分组汇总"}]; // 用户分组汇总
}

// 用户注册分组汇总项
message BaseUserSummaryItem {
  int64 key = 1 [(gnostic.openapi.v3.property) = {description: "分组序号"}]; // 分组序号

  int64 count = 2 [(gnostic.openapi.v3.property) = {description: "用户数"}]; // 用户数
}

syntax = "proto3";

package system.admin.v1;

import "common/v1/common.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "system/admin/v1/workflow_common.proto";

// Admin工作流流程实例服务
service WorkflowInstanceService {
  // 重试失败的工作流脚本
  rpc RetryWorkflowScript(RetryWorkflowScriptRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/workflow/instance/{instance_id}/script-run/{id}/retry"
      body: "*"
    };
  }

  // 提交审批申请
  rpc SubmitWorkflowInstance(SubmitWorkflowInstanceRequest) returns (SubmitWorkflowInstanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/workflow/instance"
      body: "*"
    };
  }

  // 撤回审批申请
  rpc WithdrawWorkflowInstance(WithdrawWorkflowInstanceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/workflow/instance/{id}/withdraw"
      body: "*"
    };
  }

  // 查询流程实例分页列表
  rpc PageWorkflowInstance(PageWorkflowInstanceRequest) returns (PageWorkflowInstanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/workflow/instance"
    };
  }

  // 查询流程实例详情
  rpc GetWorkflowInstance(GetWorkflowInstanceRequest) returns (GetWorkflowInstanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/workflow/instance/{id}"
    };
  }
}

// 提交审批申请请求参数
message SubmitWorkflowInstanceRequest {
  string code = 1 [(gnostic.openapi.v3.property) = {description: "流程编码"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.submit.code.required" message: "流程编码不能为空" expression: "this.size() > 0"}]; // 流程编码

  int32 version = 2 [(gnostic.openapi.v3.property) = {description: "流程版本"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.submit.version.required" message: "流程版本不能为空" expression: "this > 0"}]; // 流程版本

  string form_data = 3 [(gnostic.openapi.v3.property) = {description: "申请表单数据JSON"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.submit.form_data.required" message: "申请表单数据不能为空" expression: "this.size() > 0"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.submit.form_data.max_length" message: "申请表单数据不能超过 65536 个字符" expression: "this.size() <= 65536"}]; // 申请表单数据JSON

  string business_type = 4 [(gnostic.openapi.v3.property) = {description: "业务单据类型"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.submit.business_type.max_length" message: "业务单据类型不能超过 50 个字符" expression: "this.size() <= 50"}]; // 业务单据类型

  int64 business_id = 5 [(gnostic.openapi.v3.property) = {description: "业务单据ID"}]; // 业务单据ID
}

// 提交审批申请响应
message SubmitWorkflowInstanceResponse {
  int64 instance_id = 1 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}]; // 流程实例ID
}

// 撤回审批申请请求参数
message WithdrawWorkflowInstanceRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.withdraw.id.required" message: "流程实例ID不能为空" expression: "this > 0"}]; // 流程实例ID
}

// 流程实例分页查询条件
message PageWorkflowInstanceRequest {
  string code = 2 [(gnostic.openapi.v3.property) = {description: "流程编码"}]; // 流程编码

  int64 definition_id = 3 [(gnostic.openapi.v3.property) = {description: "流程定义ID"}]; // 流程定义ID

  int64 applicant_user_id = 4 [(gnostic.openapi.v3.property) = {description: "申请人用户ID"}]; // 申请人用户ID

  optional int64 tenant_id = 5 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  string business_type = 6 [(gnostic.openapi.v3.property) = {description: "业务单据类型"}]; // 业务单据类型

  optional WorkflowInstanceStatus status = 100 [(gnostic.openapi.v3.property) = {description: "实例状态"}]; // 实例状态

  int64 page_num = 101 [(gnostic.openapi.v3.property) = {
    description: "当前页码"
    default: {number: 1}
  },
    (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码

  int64 page_size = 102 [(gnostic.openapi.v3.property) = {
    description: "每一页的行数"
    default: {number: 10}
  },
    (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每一页的行数
}

// 流程实例分页响应
message PageWorkflowInstanceResponse {
  repeated WorkflowInstance instances = 1 [(gnostic.openapi.v3.property) = {description: "分页数据"}]; // 分页数据

  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询流程实例详情请求参数
message GetWorkflowInstanceRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}, (buf.validate.field).cel = {id: "system.admin.workflow.instance.get.id.required" message: "流程实例ID不能为空" expression: "this > 0"}]; // 流程实例ID
}

// 流程实例详情响应
message GetWorkflowInstanceResponse {
  WorkflowInstance instance = 1 [(gnostic.openapi.v3.property) = {description: "流程实例"}]; // 流程实例

  repeated WorkflowLog logs = 2 [(gnostic.openapi.v3.property) = {description: "审批日志"}]; // 审批日志

  repeated WorkflowTask tasks = 3 [(gnostic.openapi.v3.property) = {description: "审批任务"}]; // 审批任务

  repeated WorkflowScriptRun script_runs = 4 [(gnostic.openapi.v3.property) = {description: "脚本执行记录"}]; // 脚本执行记录
}

// 流程实例
message WorkflowInstance {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}]; // 流程实例ID

  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  int64 definition_id = 3 [(gnostic.openapi.v3.property) = {description: "流程定义ID"}]; // 流程定义ID

  string definition_code = 4 [(gnostic.openapi.v3.property) = {description: "流程编码"}]; // 流程编码

  string definition_name = 5 [(gnostic.openapi.v3.property) = {description: "流程名称"}]; // 流程名称

  int64 applicant_user_id = 6 [(gnostic.openapi.v3.property) = {description: "申请人用户ID"}]; // 申请人用户ID

  string applicant_name = 7 [(gnostic.openapi.v3.property) = {description: "申请人昵称"}]; // 申请人昵称

  string form_data = 8 [(gnostic.openapi.v3.property) = {description: "申请表单数据JSON"}]; // 申请表单数据JSON

  string business_type = 9 [(gnostic.openapi.v3.property) = {description: "业务单据类型"}]; // 业务单据类型

  int64 business_id = 10 [(gnostic.openapi.v3.property) = {description: "业务单据ID"}]; // 业务单据ID

  string node_config = 11 [(gnostic.openapi.v3.property) = {description: "流程节点图快照（不含脚本源码）"}]; // 流程节点图快照（不含脚本源码）

  string variables = 12 [(gnostic.openapi.v3.property) = {description: "流程变量JSON"}]; // 流程变量JSON

  WorkflowInstanceStatus status = 100 [(gnostic.openapi.v3.property) = {description: "实例状态"}]; // 实例状态

  string submit_at = 200 [(gnostic.openapi.v3.property) = {description: "提交时间"}]; // 提交时间

  string end_at = 201 [(gnostic.openapi.v3.property) = {description: "终结时间"}]; // 终结时间

  string created_at = 202 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间

  string updated_at = 203 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 审批任务
message WorkflowTask {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "审批任务ID"}]; // 审批任务ID

  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  int64 instance_id = 3 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}]; // 流程实例ID

  string node_id = 4 [(gnostic.openapi.v3.property) = {description: "节点ID"}]; // 节点ID

  int64 assignee_user_id = 5 [(gnostic.openapi.v3.property) = {description: "办理人用户ID"}]; // 办理人用户ID

  string assignee_name = 6 [(gnostic.openapi.v3.property) = {description: "办理人昵称"}]; // 办理人昵称

  WorkflowTaskStatus status = 100 [(gnostic.openapi.v3.property) = {description: "任务状态"}]; // 任务状态

  string comment = 101 [(gnostic.openapi.v3.property) = {description: "审批意见"}]; // 审批意见

  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间

  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 审批日志
message WorkflowLog {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "审批日志ID"}]; // 审批日志ID

  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  int64 instance_id = 3 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}]; // 流程实例ID

  string node_id = 4 [(gnostic.openapi.v3.property) = {description: "节点ID"}]; // 节点ID

  int64 task_id = 5 [(gnostic.openapi.v3.property) = {description: "审批任务ID"}]; // 审批任务ID

  WorkflowLogAction action = 6 [(gnostic.openapi.v3.property) = {description: "日志动作"}]; // 日志动作

  int64 operator_user_id = 7 [(gnostic.openapi.v3.property) = {description: "操作人用户ID"}]; // 操作人用户ID

  string operator_name = 8 [(gnostic.openapi.v3.property) = {description: "操作人昵称"}]; // 操作人昵称

  string comment = 101 [(gnostic.openapi.v3.property) = {description: "审批意见"}]; // 审批意见

  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// 重试工作流脚本请求
message RetryWorkflowScriptRequest {
  int64 instance_id = 1 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}, (buf.validate.field).int64.gt = 0]; // 流程实例ID
  int64 id = 2 [(gnostic.openapi.v3.property) = {description: "脚本执行ID"}, (buf.validate.field).int64.gt = 0]; // 脚本执行ID
}

// 工作流脚本执行记录
message WorkflowScriptRun {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "脚本执行ID"}]; // 脚本执行ID
  int64 instance_id = 2 [(gnostic.openapi.v3.property) = {description: "流程实例ID"}]; // 流程实例ID
  string node_id = 3 [(gnostic.openapi.v3.property) = {description: "节点ID"}]; // 节点ID
  string stage = 4 [(gnostic.openapi.v3.property) = {description: "执行阶段"}]; // 执行阶段
  int64 script_id = 5 [(gnostic.openapi.v3.property) = {description: "脚本ID"}]; // 脚本ID
  string script_name = 6 [(gnostic.openapi.v3.property) = {description: "脚本名称快照"}]; // 脚本名称快照
  int32 version = 7 [(gnostic.openapi.v3.property) = {description: "脚本版本"}]; // 脚本版本
  string status = 8 [(gnostic.openapi.v3.property) = {description: "执行状态：PENDING/RUNNING/SUCCEEDED/FAILED/CANCELED"}]; // 执行状态：PENDING/RUNNING/SUCCEEDED/FAILED/CANCELED
  int32 attempts = 9 [(gnostic.openapi.v3.property) = {description: "尝试次数"}]; // 尝试次数
  string input_json = 10 [(gnostic.openapi.v3.property) = {description: "输入JSON"}]; // 输入JSON
  string output_json = 11 [(gnostic.openapi.v3.property) = {description: "输出JSON"}]; // 输出JSON
  string last_error = 12 [(gnostic.openapi.v3.property) = {description: "最近错误"}]; // 最近错误
  int64 duration_ms = 13 [(gnostic.openapi.v3.property) = {description: "耗时毫秒"}]; // 耗时毫秒
  string next_retry_at = 14 [(gnostic.openapi.v3.property) = {description: "下次重试时间"}]; // 下次重试时间
  string created_at = 15 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 16 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

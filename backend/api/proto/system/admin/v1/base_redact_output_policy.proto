syntax = "proto3";

package system.admin.v1;

import "common/v1/enum.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Admin出库脱敏策略服务。
service BaseRedactOutputPolicyService {
  // 查询出库脱敏策略分页列表。
  rpc PageBaseRedactOutputPolicy(PageBaseRedactOutputPolicyRequest) returns (PageBaseRedactOutputPolicyResponse) { option (google.api.http) = {get: "/api/v1/admin/base/redact-output-policy"}; }
  // 查询出库脱敏策略详情。
  rpc GetBaseRedactOutputPolicy(GetBaseRedactOutputPolicyRequest) returns (BaseRedactOutputPolicyForm) { option (google.api.http) = {get: "/api/v1/admin/base/redact-output-policy/{id}"}; }
  // 批量创建出库脱敏策略。
  rpc CreateBaseRedactOutputPolicy(CreateBaseRedactOutputPolicyRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/api/v1/admin/base/redact-output-policy", body: "*"}; }
  // 批量更新出库脱敏策略。
  rpc UpdateBaseRedactOutputPolicy(UpdateBaseRedactOutputPolicyRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-output-policy", body: "*"}; }
  // 删除出库脱敏策略。
  rpc DeleteBaseRedactOutputPolicy(DeleteBaseRedactOutputPolicyRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/redact-output-policy/{id}"}; }
  // 设置出库脱敏策略状态。
  rpc SetBaseRedactOutputPolicyStatus(SetBaseRedactOutputPolicyStatusRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-output-policy/{id}/status", body: "*"}; }
}

// 出库脱敏策略处理模式。
enum BaseRedactOutputPolicyMode {
  // 未指定模式。
  BASE_REDACT_OUTPUT_POLICY_MODE_UNSPECIFIED = 0;
  // 使用规则模板处理。
  BASE_REDACT_OUTPUT_POLICY_MODE_RULE = 1;
  // 替换为字段零值。
  BASE_REDACT_OUTPUT_POLICY_MODE_HIDE = 2;
  // 保留字段原值。
  BASE_REDACT_OUTPUT_POLICY_MODE_FULL = 3;
}

// 出库脱敏策略分页查询条件。
message PageBaseRedactOutputPolicyRequest {
  string operation = 1 [(gnostic.openapi.v3.property) = {description: "接口操作"}]; // 接口操作
  string message_ref = 2 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}]; // Proto消息完整名称
  string field_path = 3 [(gnostic.openapi.v3.property) = {description: "返回字段路径"}]; // 返回字段路径
  string service_name = 4 [(gnostic.openapi.v3.property) = {description: "服务名"}]; // 服务名
  optional BaseRedactOutputPolicyMode mode = 100 [(gnostic.openapi.v3.property) = {description: "处理模式"}]; // 处理模式
  optional .common.v1.Status status = 101 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  int64 page_num = 102 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}]; // 当前页码
  int64 page_size = 103 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}]; // 每页数量
}

// 出库脱敏策略分页响应。
message PageBaseRedactOutputPolicyResponse {
  repeated BaseRedactOutputPolicy base_redact_output_policies = 1 [(gnostic.openapi.v3.property) = {description: "出库脱敏策略列表"}]; // 出库脱敏策略列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 出库脱敏策略详情查询条件。
message GetBaseRedactOutputPolicyRequest { int64 id = 1 [(gnostic.openapi.v3.property) = {description: "出库策略ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.get.id.required" message: "出库策略ID不能为空" expression: "this > 0"}]; } // 出库策略ID

// 出库脱敏策略表单。
message BaseRedactOutputPolicyForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "出库策略ID"}]; // 出库策略ID
  string operation = 2 [(gnostic.openapi.v3.property) = {description: "接口操作"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.operation.required" message: "接口操作不能为空且不超过255个字符" expression: "this.size() > 0 && this.size() <= 255"}]; // 接口操作
  string message_ref = 3 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.message_ref.required" message: "Proto消息完整名称不能为空且不超过255个字符" expression: "this.size() > 0 && this.size() <= 255"}]; // Proto消息完整名称
  string field_path = 4 [(gnostic.openapi.v3.property) = {description: "返回字段路径"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.field_path.required" message: "返回字段路径不能为空且不超过255个字符" expression: "this.size() > 0 && this.size() <= 255"}]; // 返回字段路径
  string service_name = 5 [(gnostic.openapi.v3.property) = {description: "服务名"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.service_name.required" message: "服务名不能为空且不能超过50个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 服务名
  BaseRedactOutputPolicyMode mode = 100 [(gnostic.openapi.v3.property) = {description: "处理模式"}, (buf.validate.field).enum = {defined_only: true}]; // 处理模式
  int64 rule_id = 101 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string rule_params = 102 [(gnostic.openapi.v3.property) = {description: "规则参数"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.rule_params.required" message: "规则参数不能为空" expression: "this.size() > 0"}]; // 规则参数
  .common.v1.Status status = 103 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
  string remark = 104 [(gnostic.openapi.v3.property) = {description: "备注"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.remark.length" message: "备注不能超过500个字符" expression: "this.size() <= 500"}]; // 备注
}

// 创建出库脱敏策略请求参数。
message CreateBaseRedactOutputPolicyRequest {
  repeated BaseRedactOutputPolicyForm base_redact_output_policy = 1 [
    (gnostic.openapi.v3.property) = {description: "出库脱敏策略列表"},
    (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.create.list.required" message: "出库脱敏策略列表不能为空" expression: "this.size() > 0"}
  ]; // 出库脱敏策略列表
}
// 更新出库脱敏策略请求参数。
message UpdateBaseRedactOutputPolicyRequest {
  repeated BaseRedactOutputPolicyForm base_redact_output_policy = 1 [
    (gnostic.openapi.v3.property) = {description: "出库脱敏策略列表"},
    (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.update.list.required" message: "出库脱敏策略列表不能为空" expression: "this.size() > 0"}
  ]; // 出库脱敏策略列表
}
// 删除出库脱敏策略请求参数。
message DeleteBaseRedactOutputPolicyRequest { string id = 1 [(gnostic.openapi.v3.property) = {description: "出库策略ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.delete.id.required" message: "出库策略ID列表不能为空" expression: "this.size() > 0"}]; } // 出库策略ID列表
// 设置出库脱敏策略状态请求参数。
message SetBaseRedactOutputPolicyStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "出库策略ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.output_policy.status.id.required" message: "出库策略ID不能为空" expression: "this > 0"}]; // 出库策略ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 出库脱敏策略。
message BaseRedactOutputPolicy {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "出库策略ID"}]; // 出库策略ID
  string operation = 2 [(gnostic.openapi.v3.property) = {description: "接口操作"}]; // 接口操作
  string message_ref = 3 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}]; // Proto消息完整名称
  string field_path = 4 [(gnostic.openapi.v3.property) = {description: "返回字段路径"}]; // 返回字段路径
  BaseRedactOutputPolicyMode mode = 100 [(gnostic.openapi.v3.property) = {description: "处理模式"}]; // 处理模式
  int64 rule_id = 101 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string rule_code = 102 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string rule_name = 103 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  string rule_type = 104 [(gnostic.openapi.v3.property) = {description: "规则类型"}]; // 规则类型
  string rule_params = 105 [(gnostic.openapi.v3.property) = {description: "规则参数"}]; // 规则参数
  string service_name = 108 [(gnostic.openapi.v3.property) = {description: "服务名"}]; // 服务名
  .common.v1.Status status = 106 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  string remark = 107 [(gnostic.openapi.v3.property) = {description: "备注"}]; // 备注
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

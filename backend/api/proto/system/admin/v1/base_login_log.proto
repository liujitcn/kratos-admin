syntax = "proto3";

package system.admin.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "system/admin/v1/base_log.proto";

// 登录日志服务。
service BaseLoginLogService {
  // 分页查询登录日志。
  rpc PageBaseLoginLog(PageBaseLoginLogRequest) returns (PageBaseLoginLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/login-log"};
  }

  // 查询登录日志详情。
  rpc GetBaseLoginLog(GetBaseLoginLogRequest) returns (BaseLoginLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/login-log/{id}"};
  }
}

// BaseLoginLogType 定义认证链路产生的登录事件类型。
// 类型用于区分密码、OAuth、MFA、令牌刷新和退出操作的审计统计。
enum BaseLoginLogType {
  // 未指定登录日志类型。
  BASE_LOGIN_LOG_TYPE_UNSPECIFIED = 0;
  // 密码登录。
  BASE_LOGIN_LOG_TYPE_PASSWORD = 1;
  // OAuth 登录。
  BASE_LOGIN_LOG_TYPE_OAUTH = 2;
  // 多因素认证。
  BASE_LOGIN_LOG_TYPE_MFA = 3;
  // 刷新访问令牌。
  BASE_LOGIN_LOG_TYPE_TOKEN_REFRESH = 4;
  // 退出登录。
  BASE_LOGIN_LOG_TYPE_LOGOUT = 5;
}

// 登录日志分页查询条件。
message PageBaseLoginLogRequest {
  optional int64 tenant_id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  optional int64 user_id = 2 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID
  optional BaseLoginLogType login_type = 3 [(gnostic.openapi.v3.property) = {description: "登录类型"}]; // 登录类型
  optional BaseLogResult result = 4 [(gnostic.openapi.v3.property) = {description: "结果"}]; // 结果
  repeated string occurred_at = 5 [(gnostic.openapi.v3.property) = {description: "事件时间"}]; // 事件时间
  string keyword = 6 [(gnostic.openapi.v3.property) = {description: "账号、租户或IP关键字"}]; // 关键字
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码"}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数"}]; // 每页行数
}

// 登录日志分页响应。
message PageBaseLoginLogResponse {
  repeated BaseLoginLog base_login_logs = 1 [(gnostic.openapi.v3.property) = {description: "登录日志列表"}]; // 登录日志列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询登录日志详情请求。
message GetBaseLoginLogRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "登录日志ID"}]; // 登录日志ID
}

// 登录日志。
message BaseLoginLog {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "登录日志ID"}]; // 登录日志ID
  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  string tenant_code = 3 [(gnostic.openapi.v3.property) = {description: "租户编码"}]; // 租户编码
  int64 user_id = 4 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID
  string user_name = 5 [(gnostic.openapi.v3.property) = {description: "账号名"}]; // 账号名
  BaseLoginLogType login_type = 6 [(gnostic.openapi.v3.property) = {description: "登录类型"}]; // 登录类型
  BaseLogResult result = 7 [(gnostic.openapi.v3.property) = {description: "结果"}]; // 结果
  string reason_code = 8 [(gnostic.openapi.v3.property) = {description: "原因编码"}]; // 原因编码
  string reason = 9 [(gnostic.openapi.v3.property) = {description: "原因说明"}]; // 原因说明
  string client_ip = 10 [(gnostic.openapi.v3.property) = {description: "客户端IP"}]; // 客户端IP
  string user_agent = 11 [(gnostic.openapi.v3.property) = {description: "用户代理"}]; // 用户代理
  string device_id = 12 [(gnostic.openapi.v3.property) = {description: "设备标识"}]; // 设备标识
  string request_id = 13 [(gnostic.openapi.v3.property) = {description: "请求ID"}]; // 请求ID
  string trace_id = 14 [(gnostic.openapi.v3.property) = {description: "链路追踪ID"}]; // 链路追踪ID
  string occurred_at = 15 [(gnostic.openapi.v3.property) = {description: "事件发生时间"}]; // 事件发生时间
  string created_at = 16 [(gnostic.openapi.v3.property) = {description: "日志落库时间"}]; // 日志落库时间
}

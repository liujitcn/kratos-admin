syntax = "proto3";

package system.admin.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "system/admin/v1/base_log.proto";

// 权限日志服务。
service BasePermissionLogService {
  // 分页查询权限日志。
  rpc PageBasePermissionLog(PageBasePermissionLogRequest) returns (PageBasePermissionLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/permission-log"};
  }

  // 查询权限日志详情。
  rpc GetBasePermissionLog(GetBasePermissionLogRequest) returns (BasePermissionLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/permission-log/{id}"};
  }
}

// BasePermissionTargetType 定义权限变更所作用的安全对象类型。
// 目标可为用户、角色、菜单、API 或租户，便于审计定位授权边界。
enum BasePermissionTargetType {
  // 未指定权限目标类型。
  BASE_PERMISSION_TARGET_TYPE_UNSPECIFIED = 0;
  // 用户权限。
  BASE_PERMISSION_TARGET_TYPE_USER = 1;
  // 角色权限。
  BASE_PERMISSION_TARGET_TYPE_ROLE = 2;
  // 菜单权限。
  BASE_PERMISSION_TARGET_TYPE_MENU = 3;
  // API 权限。
  BASE_PERMISSION_TARGET_TYPE_API = 4;
  // 租户权限。
  BASE_PERMISSION_TARGET_TYPE_TENANT = 5;
}

// BasePermissionAction 定义安全对象及其授权关系的变更动作。
// 授予、回收和对象增删改均应保留对应的审计上下文。
enum BasePermissionAction {
  // 未指定权限动作。
  BASE_PERMISSION_ACTION_UNSPECIFIED = 0;
  // 授予权限。
  BASE_PERMISSION_ACTION_GRANT = 1;
  // 回收权限。
  BASE_PERMISSION_ACTION_REVOKE = 2;
  // 新增权限对象。
  BASE_PERMISSION_ACTION_CREATE = 3;
  // 修改权限对象。
  BASE_PERMISSION_ACTION_UPDATE = 4;
  // 删除权限对象。
  BASE_PERMISSION_ACTION_DELETE = 5;
  // 分配权限。
  BASE_PERMISSION_ACTION_ASSIGN = 6;
}

// 权限日志分页查询条件。
message PageBasePermissionLogRequest {
  optional int64 tenant_id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  optional int64 user_id = 2 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID
  optional BasePermissionTargetType target_type = 3 [(gnostic.openapi.v3.property) = {description: "目标类型"}]; // 目标类型
  optional BasePermissionAction action = 4 [(gnostic.openapi.v3.property) = {description: "权限动作"}]; // 权限动作
  optional BaseLogResult result = 5 [(gnostic.openapi.v3.property) = {description: "结果"}]; // 结果
  repeated string occurred_at = 6 [(gnostic.openapi.v3.property) = {description: "事件时间"}]; // 事件时间
  string keyword = 7 [(gnostic.openapi.v3.property) = {description: "目标或请求ID关键字"}]; // 关键字
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码"}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数"}]; // 每页行数
}

// 权限日志分页响应。
message PageBasePermissionLogResponse {
  repeated BasePermissionLog base_permission_logs = 1 [(gnostic.openapi.v3.property) = {description: "权限日志列表"}]; // 权限日志列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询权限日志详情请求。
message GetBasePermissionLogRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "权限日志ID"}]; // 权限日志ID
}

// 权限日志。
message BasePermissionLog {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "权限日志ID"}]; // 权限日志ID
  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  string tenant_code = 3 [(gnostic.openapi.v3.property) = {description: "租户编码"}]; // 租户编码
  int64 user_id = 4 [(gnostic.openapi.v3.property) = {description: "用户ID"}]; // 用户ID
  string user_name = 5 [(gnostic.openapi.v3.property) = {description: "用户名称"}]; // 用户名称
  string request_id = 6 [(gnostic.openapi.v3.property) = {description: "请求ID"}]; // 请求ID
  string trace_id = 7 [(gnostic.openapi.v3.property) = {description: "链路追踪ID"}]; // 链路追踪ID
  BasePermissionTargetType target_type = 8 [(gnostic.openapi.v3.property) = {description: "目标类型"}]; // 目标类型
  string target_id = 9 [(gnostic.openapi.v3.property) = {description: "目标ID"}]; // 目标ID
  string target_name = 10 [(gnostic.openapi.v3.property) = {description: "目标名称"}]; // 目标名称
  BasePermissionAction action = 11 [(gnostic.openapi.v3.property) = {description: "权限动作"}]; // 权限动作
  string old_value = 12 [(gnostic.openapi.v3.property) = {description: "变更前权限"}]; // 变更前权限
  string new_value = 13 [(gnostic.openapi.v3.property) = {description: "变更后权限"}]; // 变更后权限
  BaseLogResult result = 14 [(gnostic.openapi.v3.property) = {description: "结果"}]; // 结果
  string reason_code = 15 [(gnostic.openapi.v3.property) = {description: "原因编码"}]; // 原因编码
  string reason = 16 [(gnostic.openapi.v3.property) = {description: "原因说明"}]; // 原因说明
  string occurred_at = 17 [(gnostic.openapi.v3.property) = {description: "事件发生时间"}]; // 事件发生时间
  string created_at = 18 [(gnostic.openapi.v3.property) = {description: "日志落库时间"}]; // 日志落库时间
}

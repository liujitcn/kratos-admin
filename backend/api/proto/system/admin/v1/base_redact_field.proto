syntax = "proto3";

package system.admin.v1;

import "common/v1/common.proto";
import "common/v1/enum.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "system/admin/v1/base_redact_common.proto";

// 字段数据库存储方式。
enum BaseRedactStorageMode {
  // 未配置存储方式，服务端拒绝启用字段存储保护。
  BASE_REDACT_STORAGE_MODE_UNSPECIFIED = 0;
  // 主表保存明文。
  BASE_REDACT_STORAGE_MODE_PLAIN = 1;
  // 主表保存脱敏值，旁表保存加密原文。
  BASE_REDACT_STORAGE_MODE_MASK = 2;
  // 主表保存不可逆哈希。
  BASE_REDACT_STORAGE_MODE_HASH = 3;
}

// 敏感字段查询方式。
enum BaseRedactSearchMode {
  // 未配置查询方式。
  BASE_REDACT_SEARCH_MODE_UNSPECIFIED = 0;
  // 不支持敏感字段查询。
  BASE_REDACT_SEARCH_MODE_NONE = 1;
  // 使用 HMAC 摘要进行精确查询。
  BASE_REDACT_SEARCH_MODE_DIGEST = 2;
}

// Admin脱敏字段目录服务。
service BaseRedactFieldService {
  // 查询脱敏字段选项。
  rpc OptionBaseRedactField(OptionBaseRedactFieldRequest) returns (.common.v1.SelectOptionResponse) { option (google.api.http) = {get: "/api/v1/admin/base/redact-field/option"}; }
  // 查询脱敏字段分页列表。
  rpc PageBaseRedactField(PageBaseRedactFieldRequest) returns (PageBaseRedactFieldResponse) { option (google.api.http) = {get: "/api/v1/admin/base/redact-field"}; }
  // 查询脱敏字段详情。
  rpc GetBaseRedactField(GetBaseRedactFieldRequest) returns (BaseRedactFieldForm) { option (google.api.http) = {get: "/api/v1/admin/base/redact-field/{id}"}; }
  // 更新脱敏字段。
  rpc UpdateBaseRedactField(UpdateBaseRedactFieldRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-field/{base_redact_field.id}", body: "base_redact_field"}; }
  // 删除脱敏字段。
  rpc DeleteBaseRedactField(DeleteBaseRedactFieldRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/redact-field/{id}"}; }
  // 设置脱敏字段状态。
  rpc SetBaseRedactFieldStatus(SetBaseRedactFieldStatusRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-field/{id}/status", body: "*"}; }
}

// 脱敏字段选项查询条件。
message OptionBaseRedactFieldRequest {
  string keyword = 1 [(gnostic.openapi.v3.property) = {description: "字段关键字"}]; // 字段关键字
  string operation = 2 [(gnostic.openapi.v3.property) = {description: "接口操作"}]; // 接口操作
  optional BaseRedactDirection direction = 3 [(gnostic.openapi.v3.property) = {description: "脱敏方向"}]; // 脱敏方向
}
// 脱敏字段分页查询条件。
message PageBaseRedactFieldRequest {
  string message_ref = 1 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}]; // Proto消息完整名称
  string field_path = 2 [(gnostic.openapi.v3.property) = {description: "字段路径"}]; // 字段路径
  string sensitivity_type = 3 [(gnostic.openapi.v3.property) = {description: "敏感字段类型"}]; // 敏感字段类型
  string source = 4 [(gnostic.openapi.v3.property) = {description: "字段来源"}]; // 字段来源
  optional .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}]; // 每页数量
}
// 脱敏字段分页响应。
message PageBaseRedactFieldResponse {
  repeated BaseRedactField base_redact_fields = 1 [(gnostic.openapi.v3.property) = {description: "字段列表"}]; // 字段列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}
// 脱敏字段详情查询条件。
message GetBaseRedactFieldRequest { int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字段目录ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.get.id.required" message: "字段目录ID不能为空" expression: "this > 0"}]; } // 字段目录ID
// 脱敏字段表单。
message BaseRedactFieldForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字段目录ID"}]; // 字段目录ID
  string message_ref = 2 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.message_ref.required" message: "Proto消息完整名称不能为空且不超过255个字符" expression: "this.size() > 0 && this.size() <= 255"}]; // Proto消息完整名称
  string field_path = 3 [(gnostic.openapi.v3.property) = {description: "字段路径"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.field_path.required" message: "字段路径不能为空且不超过255个字符" expression: "this.size() > 0 && this.size() <= 255"}]; // 字段路径
  string field_kind = 4 [(gnostic.openapi.v3.property) = {description: "Proto字段类型"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.field_kind.length" message: "Proto字段类型不能超过32个字符" expression: "this.size() <= 32"}]; // Proto字段类型
  string sensitivity_type = 5 [(gnostic.openapi.v3.property) = {description: "敏感字段类型"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.sensitivity_type.length" message: "敏感字段类型不能超过32个字符" expression: "this.size() <= 32"}]; // 敏感字段类型
  string source = 6 [(gnostic.openapi.v3.property) = {description: "字段来源"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.source.supported" message: "字段来源只能是PROTO" expression: "this == 'PROTO'"}]; // 字段来源
  string entity_ref = 7 [(gnostic.openapi.v3.property) = {description: "数据实体标识"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.entity_ref.length" message: "数据实体标识不能超过255个字符" expression: "this.size() <= 255"}]; // 数据实体标识
  string table_name = 8 [(gnostic.openapi.v3.property) = {description: "数据库表名"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.table_name.length" message: "数据库表名不能超过128个字符" expression: "this.size() <= 128"}]; // 数据库表名
  string column_name = 9 [(gnostic.openapi.v3.property) = {description: "数据库字段名"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.column_name.length" message: "数据库字段名不能超过128个字符" expression: "this.size() <= 128"}]; // 数据库字段名
  string record_key_field = 10 [(gnostic.openapi.v3.property) = {description: "业务主键字段"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.record_key_field.length" message: "业务主键字段不能超过64个字符" expression: "this.size() <= 64"}]; // 业务主键字段
  BaseRedactStorageMode storage_mode = 11 [(gnostic.openapi.v3.property) = {description: "数据库存储方式"}, (buf.validate.field).enum = {defined_only: true}]; // 数据库存储方式
  int64 storage_rule_id = 12 [(gnostic.openapi.v3.property) = {description: "存储脱敏规则ID"}]; // 存储脱敏规则ID
  BaseRedactSearchMode search_mode = 13 [(gnostic.openapi.v3.property) = {description: "敏感字段查询方式"}, (buf.validate.field).enum = {defined_only: true}]; // 敏感字段查询方式
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
  string remark = 101 [(gnostic.openapi.v3.property) = {description: "备注"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.remark.length" message: "备注不能超过500个字符" expression: "this.size() <= 500"}]; // 备注
}
// 更新脱敏字段请求参数。
message UpdateBaseRedactFieldRequest { BaseRedactFieldForm base_redact_field = 1 [(gnostic.openapi.v3.property) = {description: "脱敏字段表单"}, (buf.validate.field).required = true]; }
// 删除脱敏字段请求参数。
message DeleteBaseRedactFieldRequest { string id = 1 [(gnostic.openapi.v3.property) = {description: "字段目录ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.delete.id.required" message: "字段目录ID列表不能为空" expression: "this.size() > 0"}]; }
// 设置脱敏字段状态请求参数。
message SetBaseRedactFieldStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字段目录ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.field.status.id.required" message: "字段目录ID不能为空" expression: "this > 0"}]; // 字段目录ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}
// 脱敏字段目录。
message BaseRedactField {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字段目录ID"}]; // 字段目录ID
  string message_ref = 2 [(gnostic.openapi.v3.property) = {description: "Proto消息完整名称"}]; // Proto消息完整名称
  string field_path = 3 [(gnostic.openapi.v3.property) = {description: "字段路径"}]; // 字段路径
  string field_kind = 4 [(gnostic.openapi.v3.property) = {description: "Proto字段类型"}]; // Proto字段类型
  string sensitivity_type = 5 [(gnostic.openapi.v3.property) = {description: "敏感字段类型"}]; // 敏感字段类型
  string source = 6 [(gnostic.openapi.v3.property) = {description: "字段来源"}]; // 字段来源
  string entity_ref = 7 [(gnostic.openapi.v3.property) = {description: "数据实体标识"}]; // 数据实体标识
  string table_name = 8 [(gnostic.openapi.v3.property) = {description: "数据库表名"}]; // 数据库表名
  string column_name = 9 [(gnostic.openapi.v3.property) = {description: "数据库字段名"}]; // 数据库字段名
  string record_key_field = 10 [(gnostic.openapi.v3.property) = {description: "业务主键字段"}]; // 业务主键字段
  BaseRedactStorageMode storage_mode = 11 [(gnostic.openapi.v3.property) = {description: "数据库存储方式"}]; // 数据库存储方式
  int64 storage_rule_id = 12 [(gnostic.openapi.v3.property) = {description: "存储脱敏规则ID"}]; // 存储脱敏规则ID
  BaseRedactSearchMode search_mode = 13 [(gnostic.openapi.v3.property) = {description: "敏感字段查询方式"}]; // 敏感字段查询方式
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  string remark = 101 [(gnostic.openapi.v3.property) = {description: "备注"}]; // 备注
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

syntax = "proto3";

package system.admin.v1;

import "system/admin/v1/base_script.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

// Admin脚本执行日志服务。
service BaseScriptLogService {
  // 查询脚本执行日志分页列表。
  rpc PageBaseScriptLog(PageBaseScriptLogRequest) returns (PageBaseScriptLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/script-log"};
  }

  // 查询脚本执行日志详情。
  rpc GetBaseScriptLog(GetBaseScriptLogRequest) returns (BaseScriptLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/script-log/{id}"};
  }
}

// 脚本执行日志分页查询条件。
message PageBaseScriptLogRequest {
  int64 script_id = 1 [(gnostic.openapi.v3.property) = {description: "脚本ID"}]; // 脚本ID
  string trigger_type = 2 [(gnostic.openapi.v3.property) = {description: "触发方式"}]; // 触发方式
  optional bool success = 3 [(gnostic.openapi.v3.property) = {description: "是否成功"}]; // 是否成功
  repeated string created_at = 4 [(gnostic.openapi.v3.property) = {description: "执行时间范围"}]; // 执行时间范围
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页行数
}

// 脚本执行日志分页响应。
message PageBaseScriptLogResponse {
  repeated BaseScriptLog base_script_logs = 1 [(gnostic.openapi.v3.property) = {description: "分页数据"}]; // 分页数据
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询脚本执行日志请求参数。
message GetBaseScriptLogRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "脚本日志ID"}, (buf.validate.field).int64 = {gt: 0}]; // 脚本日志ID
}

// 脚本执行日志。
message BaseScriptLog {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "日志ID"}]; // 日志ID
  int64 script_id = 2 [(gnostic.openapi.v3.property) = {description: "脚本ID"}]; // 脚本ID
  string script_name = 3 [(gnostic.openapi.v3.property) = {description: "脚本名称"}]; // 脚本名称
  BaseScriptLanguage language = 4 [(gnostic.openapi.v3.property) = {description: "脚本语言"}]; // 脚本语言
  string trigger_type = 5 [(gnostic.openapi.v3.property) = {description: "触发方式"}]; // 触发方式
  string hook_point = 6 [(gnostic.openapi.v3.property) = {description: "钩子点或任务处理器"}]; // 钩子点或任务处理器
  int32 version = 7 [(gnostic.openapi.v3.property) = {description: "执行时版本"}]; // 执行时版本
  bool success = 8 [(gnostic.openapi.v3.property) = {description: "是否成功"}]; // 是否成功
  int64 duration_ms = 9 [(gnostic.openapi.v3.property) = {description: "耗时毫秒"}]; // 耗时毫秒
  string error = 10 [(gnostic.openapi.v3.property) = {description: "错误信息"}]; // 错误信息
  string request_id = 11 [(gnostic.openapi.v3.property) = {description: "请求ID"}]; // 请求ID
  string trace_id = 12 [(gnostic.openapi.v3.property) = {description: "链路追踪ID"}]; // 链路追踪ID
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "执行时间"}]; // 执行时间
}

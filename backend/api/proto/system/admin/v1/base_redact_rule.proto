syntax = "proto3";

package system.admin.v1;

import "common/v1/common.proto";
import "common/v1/enum.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Admin脱敏规则模板服务。
service BaseRedactRuleService {
  // 查询脱敏规则选项。
  rpc OptionBaseRedactRule(OptionBaseRedactRuleRequest) returns (.common.v1.SelectOptionResponse) { option (google.api.http) = {get: "/api/v1/admin/base/redact-rule/option"}; }
  // 查询脱敏规则分页列表。
  rpc PageBaseRedactRule(PageBaseRedactRuleRequest) returns (PageBaseRedactRuleResponse) { option (google.api.http) = {get: "/api/v1/admin/base/redact-rule"}; }
  // 查询脱敏规则详情。
  rpc GetBaseRedactRule(GetBaseRedactRuleRequest) returns (BaseRedactRuleForm) { option (google.api.http) = {get: "/api/v1/admin/base/redact-rule/{id}"}; }
  // 创建脱敏规则。
  rpc CreateBaseRedactRule(CreateBaseRedactRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/api/v1/admin/base/redact-rule", body: "base_redact_rule"}; }
  // 更新脱敏规则。
  rpc UpdateBaseRedactRule(UpdateBaseRedactRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-rule/{base_redact_rule.id}", body: "base_redact_rule"}; }
  // 删除脱敏规则。
  rpc DeleteBaseRedactRule(DeleteBaseRedactRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/redact-rule/{id}"}; }
  // 设置脱敏规则状态。
  rpc SetBaseRedactRuleStatus(SetBaseRedactRuleStatusRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/redact-rule/{id}/status", body: "*"}; }
}

// 脱敏规则选项查询条件。
message OptionBaseRedactRuleRequest { string keyword = 1 [(gnostic.openapi.v3.property) = {description: "规则关键字"}]; } // 规则关键字
// 脱敏规则分页查询条件。
message PageBaseRedactRuleRequest {
  string code = 1 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string name = 2 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  string rule_type = 3 [(gnostic.openapi.v3.property) = {description: "规则类型"}]; // 规则类型
  optional .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}]; // 每页数量
}
// 脱敏规则分页响应。
message PageBaseRedactRuleResponse {
  repeated BaseRedactRule base_redact_rules = 1 [(gnostic.openapi.v3.property) = {description: "规则列表"}]; // 规则列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}
// 脱敏规则详情查询条件。
message GetBaseRedactRuleRequest { int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.get.id.required" message: "规则ID不能为空" expression: "this > 0"}]; } // 规则ID
// 脱敏规则表单。
message BaseRedactRuleForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "规则编码"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.code.required" message: "规则编码不能为空且不超过64个字符" expression: "this.size() > 0 && this.size() <= 64"}]; // 规则编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "规则名称"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.name.required" message: "规则名称不能为空且不超过100个字符" expression: "this.size() > 0 && this.size() <= 100"}]; // 规则名称
  string rule_type = 4 [(gnostic.openapi.v3.property) = {description: "规则类型"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.rule_type.required" message: "规则类型不能为空且不超过32个字符" expression: "this.size() > 0 && this.size() <= 32"}]; // 规则类型
  string rule = 5 [(gnostic.openapi.v3.property) = {description: "规则参数"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.rule.required" message: "规则参数不能为空" expression: "this.size() > 0"}]; // 规则参数
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
  int32 version = 101 [(gnostic.openapi.v3.property) = {description: "规则版本"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.version.positive" message: "规则版本必须大于0" expression: "this > 0"}]; // 规则版本
  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.remark.length" message: "备注不能超过500个字符" expression: "this.size() <= 500"}]; // 备注
}
// 创建脱敏规则请求参数。
message CreateBaseRedactRuleRequest { BaseRedactRuleForm base_redact_rule = 1 [(gnostic.openapi.v3.property) = {description: "脱敏规则表单"}, (buf.validate.field).required = true]; }
// 更新脱敏规则请求参数。
message UpdateBaseRedactRuleRequest { BaseRedactRuleForm base_redact_rule = 1 [(gnostic.openapi.v3.property) = {description: "脱敏规则表单"}, (buf.validate.field).required = true]; }
// 删除脱敏规则请求参数。
message DeleteBaseRedactRuleRequest { string id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.delete.id.required" message: "规则ID列表不能为空" expression: "this.size() > 0"}]; }
// 设置脱敏规则状态请求参数。
message SetBaseRedactRuleStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}, (buf.validate.field).cel = {id: "system.admin.base.redact.rule.status.id.required" message: "规则ID不能为空" expression: "this > 0"}]; // 规则ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}
// 脱敏规则模板。
message BaseRedactRule {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  string rule_type = 4 [(gnostic.openapi.v3.property) = {description: "规则类型"}]; // 规则类型
  string rule = 5 [(gnostic.openapi.v3.property) = {description: "规则参数"}]; // 规则参数
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  int32 version = 101 [(gnostic.openapi.v3.property) = {description: "规则版本"}]; // 规则版本
  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注"}]; // 备注
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

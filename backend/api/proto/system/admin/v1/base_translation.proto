syntax = "proto3";

package system.admin.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "system/common/v1/enum.proto";
import "google/protobuf/empty.proto";

// 国际化翻译信息服务。
service BaseTranslationService {
  // 资源生成机器翻译。
  rpc GenerateTranslationDraft(GenerateTranslationDraftRequest) returns (GenerateTranslationDraftResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/base/translation/draft"
      body: "*"
    };
  }

  // 修改单个翻译信息；文本为空时生成并保存机器译文。
  rpc UpdateBaseTranslation(UpdateBaseTranslationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/translation/{id}"
      body: "*"
    };
  }
}

// 生成翻译草稿请求。
message GenerateTranslationDraftRequest {
  .system.common.v1.TranslationTargetType target_type = 1 [(gnostic.openapi.v3.property) = {description: "目标类型：枚举【TranslationTargetType】"}]; // 翻译目标类型
  string locale = 2 [(gnostic.openapi.v3.property) = {description: "语言区域"}]; // 语言区域
  string name = 3 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本
}

// 生成翻译草稿响应。
message GenerateTranslationDraftResponse {
  .system.common.v1.TranslationTargetType target_type = 1 [(gnostic.openapi.v3.property) = {description: "目标类型：枚举【TranslationTargetType】"}]; // 翻译目标类型
  string locale = 2 [(gnostic.openapi.v3.property) = {description: "语言区域"}]; // 语言区域
  string translation = 3 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本

}

// 修改单个翻译信息请求。
message UpdateBaseTranslationRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "翻译记录ID"}, (buf.validate.field).cel = {id: "base_translation.id.required" message: "翻译记录ID不能为空" expression: "this > 0"}]; // 翻译记录ID

  string name = 2 [(gnostic.openapi.v3.property) = {description: "翻译文本，留空时自动翻译"}]; // 翻译文本，留空时自动翻译
}


// 系统配置单语言翻译
message BaseTranslation {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "主键ID"}]; // 翻译记录ID
  .system.common.v1.TranslationTargetType target_type = 2 [(gnostic.openapi.v3.property) = {description: "目标类型：枚举【TranslationTargetType】"}]; // 翻译目标类型
  int64 target_id = 3 [(gnostic.openapi.v3.property) = {description: "目标ID"}]; // 目标资源ID
  string locale = 4 [(gnostic.openapi.v3.property) = {description: "语言区域"}]; // 语言区域
  string name = 5 [(gnostic.openapi.v3.property) = {description: "翻译文本"}]; // 翻译文本

}

// 代码生成单语言国际化配置
message CodeGenLocaleConfig {
  string comment = 1 [(gnostic.openapi.v3.property) = {description: "业务或字段描述"}]; // 业务或字段描述

  string left_tree_comment = 2 [(gnostic.openapi.v3.property) = {description: "左树描述"}]; // 左树描述
}

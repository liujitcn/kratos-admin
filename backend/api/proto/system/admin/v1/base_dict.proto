syntax = "proto3";

package system.admin.v1;

import "common/v1/enum.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "system/admin/v1/base_i18n.proto";

// Admin字典服务
service BaseDictService {
  // 查询字典列表
  rpc OptionBaseDict(OptionBaseDictRequest) returns (OptionBaseDictResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/dict/option"
    };
  }

  // 查询字典分页列表
  rpc PageBaseDict(PageBaseDictRequest) returns (PageBaseDictResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/dict"
    };
  }

  // 查询字典
  rpc GetBaseDict(GetBaseDictRequest) returns (BaseDictForm) {
    option (google.api.http) = {
      get: "/api/v1/admin/base/dict/{id}"
    };
  }

  // 创建字典
  rpc CreateBaseDict(CreateBaseDictRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/base/dict"
      body: "base_dict"
    };
  }

  // 更新字典
  rpc UpdateBaseDict(UpdateBaseDictRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/dict/{base_dict.id}"
      body: "base_dict"
    };
  }

  // 删除字典
  rpc DeleteBaseDict(DeleteBaseDictRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/admin/base/dict/{id}"
    };
  }

  // 设置状态
  rpc SetBaseDictStatus(SetBaseDictStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/admin/base/dict/{id}/status"
      body: "*"
    };
  }
}

// 字典选项查询条件
message OptionBaseDictRequest {}

// 字典选项响应
message OptionBaseDictResponse {
  // 字典项
  message BaseDictItem {
    string value = 3 [(gnostic.openapi.v3.property) = {description: "字典项值"}]; // 字典项值

    string label = 4 [(gnostic.openapi.v3.property) = {description: "字典项标签"}]; // 字典项标签

    string tag_type = 5 [(gnostic.openapi.v3.property) = {description: "标签类型，用于前端样式展示（如success、warning等）"}]; // 标签类型，用于前端样式展示（如success、warning等）
  }

  // 字典
  message BaseDict {
    string code = 2 [(gnostic.openapi.v3.property) = {description: "字典编号"}]; // 字典编号

    string name = 3 [(gnostic.openapi.v3.property) = {description: "字典名称"}]; // 字典名称

    repeated BaseDictItem items = 300 [(gnostic.openapi.v3.property) = {description: "字典属性"}]; // 字典属性
  }

  repeated BaseDict base_dicts = 1 [(gnostic.openapi.v3.property) = {description: "字典列表"}]; // 字典列表
}

// 字典分页查询条件
message PageBaseDictRequest {
  string code = 2 [(gnostic.openapi.v3.property) = {description: "字典编号"}]; // 字典编号

  string name = 3 [(gnostic.openapi.v3.property) = {description: "字典名称"}]; // 字典名称

  optional .common.v1.Status status = 51 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  int64 page_num = 101 [(gnostic.openapi.v3.property) = {
    description: "当前页码"
    default: {number: 1}
  }]; // 当前页码

  int64 page_size = 102 [(gnostic.openapi.v3.property) = {
    description: "每一页的行数"
    default: {number: 10}
  }]; // 每一页的行数
}

// 字典分页响应
message PageBaseDictResponse {
  repeated BaseDict base_dicts = 1 [(gnostic.openapi.v3.property) = {description: "分页数据"}]; // 分页数据

  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询字典请求参数
message GetBaseDictRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字典ID"}, (buf.validate.field).cel = {id: "system.admin.base.dict.get.id.required" message: "字典ID不能为空" expression: "this > 0"}]; // 字典ID
}

// 字典表单
message BaseDictForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字典ID"}]; // 字典ID

  string code = 2 [(gnostic.openapi.v3.property) = {description: "字典编号"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.code.required" message: "请输入字典编码" expression: "this.size() > 0"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.code.max_length" message: "字典编号不能超过 50 个字符" expression: "this.size() <= 50"}]; // 字典编号

  string name = 3 [(gnostic.openapi.v3.property) = {description: "字典名称"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.name.required" message: "请输入字典名称" expression: "this.size() > 0"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.name.max_length" message: "字典名称不能超过 50 个字符" expression: "this.size() <= 50"}]; // 字典名称

  repeated BaseI18n i18ns = 7 [(gnostic.openapi.v3.property) = {description: "非主语言翻译"}]; // 非主语言翻译

  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 创建字典请求参数
message CreateBaseDictRequest {
  BaseDictForm base_dict = 1 [(gnostic.openapi.v3.property) = {description: "字典表单"}, (buf.validate.field).required = true]; // 字典表单
}

// 更新字典请求参数
message UpdateBaseDictRequest {
  option (buf.validate.message).cel = {id: "system.admin.base.dict.update.id.required" message: "字典ID不能为空" expression: "this.base_dict.id > 0"};

  BaseDictForm base_dict = 1 [(gnostic.openapi.v3.property) = {description: "字典表单"}, (buf.validate.field).required = true]; // 字典表单
}

// 删除字典请求参数
message DeleteBaseDictRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "字典ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.dict.delete.id.required" message: "字典ID列表不能为空" expression: "this.size() > 0"}]; // 字典ID列表
}

// 设置字典状态请求参数
message SetBaseDictStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字典ID"}, (buf.validate.field).cel = {id: "system.admin.base.dict.set_status.id.required" message: "字典ID不能为空" expression: "this > 0"}]; // 字典ID

  int32 status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
}

// 字典
message BaseDict {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "字典ID"}]; // 字典ID

  string code = 2 [(gnostic.openapi.v3.property) = {description: "字典编号"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.code.length" message: "字典编号不能为空且不超过 50 个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 字典编号

  string name = 3 [(gnostic.openapi.v3.property) = {description: "字典名称"}, (buf.validate.field).cel = {id: "system.admin.base.dict.entity.name.length" message: "字典名称不能为空且不超过 50 个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 字典名称

  .common.v1.Status status = 101 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态

  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间

  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间

  repeated BaseI18n i18ns = 202 [(gnostic.openapi.v3.property) = {description: "非主语言翻译"}]; // 非主语言翻译
}

syntax = "proto3";

package system.admin.v1;

import "base/v1/notification.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// BaseMessageService 提供站内信管理能力。
service BaseMessageService {
  // 分页查询消息。
  rpc PageBaseMessage(PageBaseMessageRequest) returns (PageBaseMessageResponse) { option (google.api.http) = {get: "/api/v1/admin/base/message"}; }
  // 查询消息详情。
  rpc GetBaseMessage(GetBaseMessageRequest) returns (BaseMessageDetail) { option (google.api.http) = {get: "/api/v1/admin/base/message/{id}"}; }
  // 创建消息草稿。
  rpc CreateBaseMessage(CreateBaseMessageRequest) returns (CreateBaseMessageResponse) { option (google.api.http) = {post: "/api/v1/admin/base/message" body: "base_message"}; }
  // 更新消息草稿。
  rpc UpdateBaseMessage(UpdateBaseMessageRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message/{base_message.id}" body: "base_message"}; }
  // 删除消息草稿。
  rpc DeleteBaseMessage(DeleteBaseMessageRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/message/{id}"}; }
  // 发布消息。
  rpc PublishBaseMessage(PublishBaseMessageRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message/{id}/publish" body: "*"}; }
  // 取消定时发布。
  rpc CancelBaseMessageSchedule(CancelBaseMessageScheduleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message/{id}/schedule/cancel" body: "*"}; }
  // 撤回消息。
  rpc RevokeBaseMessage(RevokeBaseMessageRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message/{id}/revoke" body: "*"}; }
  // 重试消息投递任务。
  rpc RetryBaseMessageDispatch(RetryBaseMessageDispatchRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message/dispatch/{id}/retry" body: "*"}; }
}

// 消息分页查询条件。
message PageBaseMessageRequest {
  optional int64 tenant_id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  optional int64 category_id = 2 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  optional string title = 3 [(gnostic.openapi.v3.property) = {description: "消息标题"}]; // 消息标题
  optional .base.v1.MessageStatus status = 4 [(gnostic.openapi.v3.property) = {description: "消息状态"}, (buf.validate.field).enum = {defined_only: true}]; // 消息状态
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}]; // 每页数量
}

// 消息分页响应。
message PageBaseMessageResponse {
  repeated BaseMessage base_messages = 1 [(gnostic.openapi.v3.property) = {description: "消息列表"}]; // 消息列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 消息详情查询条件。
message GetBaseMessageRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.get.id.required" message: "消息ID不能为空" expression: "this > 0"}]; // 消息ID
}

// 创建消息请求。
message CreateBaseMessageRequest {
  BaseMessageForm base_message = 1 [(gnostic.openapi.v3.property) = {description: "消息表单"}, (buf.validate.field).required = true]; // 消息表单
}

// 创建消息响应。
message CreateBaseMessageResponse {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}]; // 消息ID
}

// 更新消息请求。
message UpdateBaseMessageRequest {
  BaseMessageForm base_message = 1 [(gnostic.openapi.v3.property) = {description: "消息表单"}, (buf.validate.field).required = true]; // 消息表单
}

// 删除消息请求。
message DeleteBaseMessageRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID列表"}, (buf.validate.field).cel = {id: "system.admin.base_message.delete.id.required" message: "消息ID列表不能为空" expression: "this.size() > 0"}]; // 消息ID列表
}

// 发布消息请求。
message PublishBaseMessageRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.action.id.required" message: "消息ID不能为空" expression: "this > 0"}]; // 消息ID
}

// 取消消息定时发布请求。
message CancelBaseMessageScheduleRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.action.id.required" message: "消息ID不能为空" expression: "this > 0"}]; // 消息ID
}

// 撤回消息请求。
message RevokeBaseMessageRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.action.id.required" message: "消息ID不能为空" expression: "this > 0"}]; // 消息ID
}

// 重试投递任务请求。
message RetryBaseMessageDispatchRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "投递任务ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.retry.id.required" message: "投递任务ID不能为空" expression: "this > 0"}]; // 投递任务ID
}

// 消息受众表单。
message BaseMessageAudienceForm {
  .base.v1.MessageAudienceType type = 1 [(gnostic.openapi.v3.property) = {description: "受众类型"}, (buf.validate.field).enum = {defined_only: true}]; // 受众类型
  int64 id = 2 [(gnostic.openapi.v3.property) = {description: "受众ID，租户全员为0"}]; // 受众ID
  bool include_children = 3 [(gnostic.openapi.v3.property) = {description: "是否包含子部门"}]; // 是否包含子部门
}

// 消息表单。
message BaseMessageForm {
  option (buf.validate.message).cel = {id: "system.admin.base_message.form.audiences.required" message: "消息受众不能为空" expression: "this.audiences.size() > 0"};
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}]; // 消息ID
  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  int64 category_id = 3 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}, (buf.validate.field).cel = {id: "system.admin.base_message.form.category_id.required" message: "消息分类不能为空" expression: "this > 0"}]; // 消息分类ID
  string title = 4 [(gnostic.openapi.v3.property) = {description: "消息标题"}, (buf.validate.field).cel = {id: "system.admin.base_message.form.title.length" message: "消息标题不能为空且不能超过200个字符" expression: "this.size() > 0 && this.size() <= 200"}]; // 消息标题
  string content = 5 [(gnostic.openapi.v3.property) = {description: "消息正文"}, (buf.validate.field).cel = {id: "system.admin.base_message.form.content.length" message: "消息正文不能为空且不能超过20000个字符" expression: "this.size() > 0 && this.size() <= 20000"}]; // 消息正文
  .base.v1.MessageContentFormat content_format = 6 [(gnostic.openapi.v3.property) = {description: "正文格式"}, (buf.validate.field).enum = {defined_only: true}]; // 正文格式
  .base.v1.MessagePriority priority = 7 [(gnostic.openapi.v3.property) = {description: "消息优先级"}, (buf.validate.field).enum = {defined_only: true}]; // 消息优先级
  .base.v1.MessageActionType action_type = 8 [(gnostic.openapi.v3.property) = {description: "动作类型"}, (buf.validate.field).enum = {defined_only: true}]; // 动作类型
  string action_target = 9 [(gnostic.openapi.v3.property) = {description: "动作目标"}]; // 动作目标
  string action_params = 10 [(gnostic.openapi.v3.property) = {description: "动作参数JSON"}]; // 动作参数JSON
  string scheduled_at = 11 [(gnostic.openapi.v3.property) = {description: "计划发布时间"}]; // 计划发布时间
  string expires_at = 12 [(gnostic.openapi.v3.property) = {description: "过期时间"}]; // 过期时间
  repeated BaseMessageAudienceForm audiences = 13 [(gnostic.openapi.v3.property) = {description: "消息受众"}]; // 消息受众
	int64 version = 14 [(gnostic.openapi.v3.property) = {description: "乐观锁版本"}]; // 乐观锁版本
}

// 消息列表项。
message BaseMessage {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}]; // 消息ID
  int64 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID
  int64 category_id = 3 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  string category_name = 4 [(gnostic.openapi.v3.property) = {description: "消息分类名称"}]; // 消息分类名称
  string title = 5 [(gnostic.openapi.v3.property) = {description: "消息标题"}]; // 消息标题
  .base.v1.MessagePriority priority = 6 [(gnostic.openapi.v3.property) = {description: "消息优先级"}]; // 消息优先级
  .base.v1.MessageStatus status = 7 [(gnostic.openapi.v3.property) = {description: "消息状态"}]; // 消息状态
  string sender_name = 8 [(gnostic.openapi.v3.property) = {description: "发送者名称"}]; // 发送者名称
  int64 recipient_total = 9 [(gnostic.openapi.v3.property) = {description: "目标人数"}]; // 目标人数
  int64 delivered_total = 10 [(gnostic.openapi.v3.property) = {description: "已投递人数"}]; // 已投递人数
  int64 failed_total = 11 [(gnostic.openapi.v3.property) = {description: "失败人数"}]; // 失败人数
  string scheduled_at = 12 [(gnostic.openapi.v3.property) = {description: "计划发布时间"}]; // 计划发布时间
  string published_at = 13 [(gnostic.openapi.v3.property) = {description: "发布时间"}]; // 发布时间
  string created_at = 100 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 101 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 消息投递任务。
message BaseMessageDispatch {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "投递任务ID"}]; // 投递任务ID
  .base.v1.MessageAudienceType audience_type = 2 [(gnostic.openapi.v3.property) = {description: "受众类型"}]; // 受众类型
  int64 audience_id = 3 [(gnostic.openapi.v3.property) = {description: "受众ID"}]; // 受众ID
  bool include_children = 4 [(gnostic.openapi.v3.property) = {description: "是否包含子部门"}]; // 是否包含子部门
  .base.v1.MessageDispatchStatus status = 5 [(gnostic.openapi.v3.property) = {description: "投递状态"}]; // 投递状态
  int64 matched_total = 6 [(gnostic.openapi.v3.property) = {description: "匹配人数"}]; // 匹配人数
  int64 inserted_total = 7 [(gnostic.openapi.v3.property) = {description: "新增投递人数"}]; // 新增投递人数
  int32 attempt_count = 8 [(gnostic.openapi.v3.property) = {description: "尝试次数"}]; // 尝试次数
  string last_error = 9 [(gnostic.openapi.v3.property) = {description: "最近错误"}]; // 最近错误
}

// 消息详情。
message BaseMessageDetail {
  BaseMessage base_message = 1 [(gnostic.openapi.v3.property) = {description: "消息信息"}]; // 消息信息
  BaseMessageForm form = 2 [(gnostic.openapi.v3.property) = {description: "消息表单"}]; // 消息表单
  repeated BaseMessageDispatch dispatches = 3 [(gnostic.openapi.v3.property) = {description: "投递任务"}]; // 投递任务
}

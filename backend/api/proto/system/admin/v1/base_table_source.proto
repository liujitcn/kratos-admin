syntax = "proto3";

package system.admin.v1;

import "buf/validate/validate.proto";
import "common/v1/types.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

// BaseTableSourceService 提供数据备份、数据归档和代码生成共用的数据源元数据。
service BaseTableSourceService {
  // 查询已初始化的数据源名称。
  rpc OptionBaseTableSource(OptionBaseTableSourceRequest) returns (.common.v1.StringValues) {
    option (google.api.http) = {get: "/api/v1/admin/base/table-source/option"};
  }

  // 查询指定数据源中的数据库表名称。
  rpc OptionBaseTable(OptionBaseTableRequest) returns (.common.v1.StringValues) {
    option (google.api.http) = {get: "/api/v1/admin/base/table-source/table/option"};
  }
}

// OptionBaseTableSourceRequest 查询数据源名称请求。
message OptionBaseTableSourceRequest {}

// OptionBaseTableRequest 查询指定数据源的数据库表名称请求。
message OptionBaseTableRequest {
  string source_name = 1 [
    (gnostic.openapi.v3.property) = {description: "数据源名称"},
    (buf.validate.field).cel = {
      id: "system.admin.base.table.source.option.table.source_name.required"
      message: "数据源名称不能为空"
      expression: "this.size() > 0"
    }
  ]; // 数据源名称
}

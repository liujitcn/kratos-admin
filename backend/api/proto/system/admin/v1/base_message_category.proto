syntax = "proto3";

package system.admin.v1;

import "base/v1/notification.proto";
import "buf/validate/validate.proto";
import "common/v1/enum.proto";
import "common/v1/common.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// BaseMessageCategoryService 提供消息分类管理能力。
service BaseMessageCategoryService {
  // 查询消息分类选项。
  rpc OptionBaseMessageCategory(OptionBaseMessageCategoryRequest) returns (.common.v1.SelectOptionResponse) { option (google.api.http) = {get: "/api/v1/admin/base/message-category/option"}; }
  // 分页查询消息分类。
  rpc PageBaseMessageCategory(PageBaseMessageCategoryRequest) returns (PageBaseMessageCategoryResponse) { option (google.api.http) = {get: "/api/v1/admin/base/message-category"}; }
  // 查询消息分类详情。
  rpc GetBaseMessageCategory(GetBaseMessageCategoryRequest) returns (BaseMessageCategoryForm) { option (google.api.http) = {get: "/api/v1/admin/base/message-category/{id}"}; }
  // 创建消息分类。
  rpc CreateBaseMessageCategory(CreateBaseMessageCategoryRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/api/v1/admin/base/message-category" body: "base_message_category"}; }
  // 更新消息分类。
  rpc UpdateBaseMessageCategory(UpdateBaseMessageCategoryRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message-category/{base_message_category.id}" body: "base_message_category"}; }
  // 删除消息分类。
  rpc DeleteBaseMessageCategory(DeleteBaseMessageCategoryRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/message-category/{id}"}; }
  // 设置消息分类状态。
  rpc SetBaseMessageCategoryStatus(SetBaseMessageCategoryStatusRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/message-category/{id}/status" body: "*"}; }
}

// 消息分类选项查询条件。
message OptionBaseMessageCategoryRequest {
}

// 消息分类分页查询条件。
message PageBaseMessageCategoryRequest {
  optional string name = 1 [(gnostic.openapi.v3.property) = {description: "分类名称"}]; // 分类名称
  optional string code = 2 [(gnostic.openapi.v3.property) = {description: "分类编码"}]; // 分类编码
  optional .common.v1.Status status = 3 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}]; // 每页数量
}

// 消息分类分页响应。
message PageBaseMessageCategoryResponse {
  repeated BaseMessageCategory base_message_categories = 1 [(gnostic.openapi.v3.property) = {description: "消息分类列表"}]; // 消息分类列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 消息分类详情查询条件。
message GetBaseMessageCategoryRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}, (buf.validate.field).cel = {id: "system.admin.base_message_category.get.id.required" message: "消息分类ID不能为空" expression: "this > 0"}]; // 消息分类ID
}

// 创建消息分类请求。
message CreateBaseMessageCategoryRequest {
  BaseMessageCategoryForm base_message_category = 1 [(gnostic.openapi.v3.property) = {description: "消息分类表单"}, (buf.validate.field).required = true]; // 消息分类表单
}

// 更新消息分类请求。
message UpdateBaseMessageCategoryRequest {
  BaseMessageCategoryForm base_message_category = 1 [(gnostic.openapi.v3.property) = {description: "消息分类表单"}, (buf.validate.field).required = true]; // 消息分类表单
}

// 删除消息分类请求。
message DeleteBaseMessageCategoryRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID列表"}, (buf.validate.field).cel = {id: "system.admin.base_message_category.delete.id.required" message: "消息分类ID列表不能为空" expression: "this.size() > 0"}]; // 消息分类ID列表
}

// 设置消息分类状态请求。
message SetBaseMessageCategoryStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}, (buf.validate.field).cel = {id: "system.admin.base_message_category.set_status.id.required" message: "消息分类ID不能为空" expression: "this > 0"}]; // 消息分类ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 消息分类表单。
message BaseMessageCategoryForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "分类编码"}, (buf.validate.field).cel = {id: "system.admin.base_message_category.form.code.length" message: "分类编码不能为空且不能超过50个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 分类编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "分类名称"}, (buf.validate.field).cel = {id: "system.admin.base_message_category.form.name.length" message: "分类名称不能为空且不能超过50个字符" expression: "this.size() > 0 && this.size() <= 50"}]; // 分类名称
  string icon = 4 [(gnostic.openapi.v3.property) = {description: "分类图标"}]; // 分类图标
  string color = 5 [(gnostic.openapi.v3.property) = {description: "分类颜色"}]; // 分类颜色
  int32 sort = 6 [(gnostic.openapi.v3.property) = {description: "排序"}]; // 排序
  .base.v1.MessagePriority default_priority = 7 [(gnostic.openapi.v3.property) = {description: "默认优先级"}, (buf.validate.field).enum = {defined_only: true}]; // 默认优先级
  int32 retention_days = 8 [(gnostic.openapi.v3.property) = {description: "保留天数"}]; // 保留天数
  bool allow_archive = 9 [(gnostic.openapi.v3.property) = {description: "是否允许归档"}]; // 是否允许归档
  bool allow_delete = 10 [(gnostic.openapi.v3.property) = {description: "是否允许删除"}]; // 是否允许删除
  .common.v1.Status status = 11 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 消息分类。
message BaseMessageCategory {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息分类ID"}]; // 消息分类ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "分类编码"}]; // 分类编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "分类名称"}]; // 分类名称
  string icon = 4 [(gnostic.openapi.v3.property) = {description: "分类图标"}]; // 分类图标
  string color = 5 [(gnostic.openapi.v3.property) = {description: "分类颜色"}]; // 分类颜色
  int32 sort = 6 [(gnostic.openapi.v3.property) = {description: "排序"}]; // 排序
  .base.v1.MessagePriority default_priority = 7 [(gnostic.openapi.v3.property) = {description: "默认优先级"}]; // 默认优先级
  int32 retention_days = 8 [(gnostic.openapi.v3.property) = {description: "保留天数"}]; // 保留天数
  bool allow_archive = 9 [(gnostic.openapi.v3.property) = {description: "是否允许归档"}]; // 是否允许归档
  bool allow_delete = 10 [(gnostic.openapi.v3.property) = {description: "是否允许删除"}]; // 是否允许删除
  .common.v1.Status status = 11 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  string created_at = 100 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 101 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

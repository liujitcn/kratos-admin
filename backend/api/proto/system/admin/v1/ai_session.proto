syntax = "proto3";

package system.admin.v1;

import "base/v1/ai_session.proto";
import "base/v1/ai_tool.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

// AI会话管理服务。
service AiSessionService {
  // 分页查询AI会话。
  rpc PageAiSession(PageAiSessionRequest) returns (PageAiSessionResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/ai-session"};
  }
  // 分页查询AI会话消息。
  rpc PageAiSessionMessage(PageAiSessionMessageRequest) returns (PageAiSessionMessageResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/ai-session/{id}/message"};
  }
}

// AI会话分页查询条件。
message PageAiSessionRequest {
  string title = 1 [(gnostic.openapi.v3.property) = {description: "会话标题"}]; // 会话标题
  optional base.v1.Terminal terminal = 2 [(gnostic.openapi.v3.property) = {description: "终端类型：枚举【Terminal】"}]; // 终端类型：枚举【Terminal】
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页行数
}

// AI会话分页响应。
message PageAiSessionResponse {
  repeated AiSessionRecord sessions = 1 [(gnostic.openapi.v3.property) = {description: "会话列表"}]; // 会话列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// AI会话分页记录。
message AiSessionRecord {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "会话ID"}]; // 会话ID
  int64 user_id = 2 [(gnostic.openapi.v3.property) = {description: "所属用户ID"}]; // 所属用户ID
  string user_name = 3 [(gnostic.openapi.v3.property) = {description: "用户账号"}]; // 用户账号
  string nick_name = 4 [(gnostic.openapi.v3.property) = {description: "用户昵称"}]; // 用户昵称
  string title = 5 [(gnostic.openapi.v3.property) = {description: "会话标题"}]; // 会话标题
  string summary = 6 [(gnostic.openapi.v3.property) = {description: "会话摘要"}]; // 会话摘要
  base.v1.Terminal terminal = 7 [(gnostic.openapi.v3.property) = {description: "终端类型：枚举【Terminal】"}]; // 终端类型：枚举【Terminal】
  int32 message_count = 8 [(gnostic.openapi.v3.property) = {description: "消息轮次数"}]; // 消息轮次数
  int32 input_tokens = 9 [(gnostic.openapi.v3.property) = {description: "累计输入Token数"}]; // 累计输入Token数
  int32 output_tokens = 10 [(gnostic.openapi.v3.property) = {description: "累计输出Token数"}]; // 累计输出Token数
  int32 cache_tokens = 11 [(gnostic.openapi.v3.property) = {description: "累计缓存Token数"}]; // 累计缓存Token数
  int32 total_tokens = 12 [(gnostic.openapi.v3.property) = {description: "累计总Token数"}]; // 累计总Token数
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 分页查询AI会话消息请求。
message PageAiSessionMessageRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "会话ID"}, (buf.validate.field).int64 = {gt: 0}]; // 会话ID
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页行数
}

// 分页查询AI会话消息响应。
message PageAiSessionMessageResponse {
  repeated AiSessionMessageRecord messages = 1 [(gnostic.openapi.v3.property) = {description: "消息列表"}]; // 消息列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// AI会话消息记录。
message AiSessionMessageRecord {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "消息ID"}]; // 消息ID
  string input_content = 2 [(gnostic.openapi.v3.property) = {description: "用户输入内容"}]; // 用户输入内容
  string output_content = 3 [(gnostic.openapi.v3.property) = {description: "AI回复内容"}]; // AI回复内容
  string model = 4 [(gnostic.openapi.v3.property) = {description: "回复使用的模型名称"}]; // 回复使用的模型名称
  base.v1.AiMessageStatus status = 5 [(gnostic.openapi.v3.property) = {description: "消息生成状态：枚举【AiMessageStatus】"}]; // 消息生成状态：枚举【AiMessageStatus】
  int32 input_tokens = 6 [(gnostic.openapi.v3.property) = {description: "输入Token数"}]; // 输入Token数
  int32 output_tokens = 7 [(gnostic.openapi.v3.property) = {description: "输出Token数"}]; // 输出Token数
  int32 cache_tokens = 8 [(gnostic.openapi.v3.property) = {description: "缓存Token数"}]; // 缓存Token数
  int32 total_tokens = 9 [(gnostic.openapi.v3.property) = {description: "总Token数"}]; // 总Token数
  int32 first_token_ms = 10 [(gnostic.openapi.v3.property) = {description: "首Token耗时毫秒"}]; // 首Token耗时毫秒
  int32 duration_ms = 11 [(gnostic.openapi.v3.property) = {description: "总耗时毫秒"}]; // 总耗时毫秒
  repeated AiSessionMessageAttachment attachments = 12 [(gnostic.openapi.v3.property) = {description: "附件列表"}]; // 附件列表
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
}

// AI会话消息附件。
message AiSessionMessageAttachment {
  string name = 1 [(gnostic.openapi.v3.property) = {description: "附件名称"}]; // 附件名称
  int64 size = 2 [(gnostic.openapi.v3.property) = {description: "附件大小"}]; // 附件大小
  string url = 3 [(gnostic.openapi.v3.property) = {description: "附件地址"}]; // 附件地址
  string mime_type = 4 [(gnostic.openapi.v3.property) = {description: "附件 MIME 类型"}]; // 附件 MIME 类型
}

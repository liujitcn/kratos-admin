syntax = "proto3";

package system.admin.v1;

import "buf/validate/validate.proto";
import "common/v1/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// AI供应商管理服务。
service AiProviderService {
  // 分页查询AI供应商。
  rpc PageAiProvider(PageAiProviderRequest) returns (PageAiProviderResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/ai-provider"};
  }
  // 查询AI供应商表单。
  rpc GetAiProvider(GetAiProviderRequest) returns (AiProviderForm) {
    option (google.api.http) = {get: "/api/v1/admin/base/ai-provider/{id}"};
  }
  // 创建AI供应商。
  rpc CreateAiProvider(CreateAiProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/api/v1/admin/base/ai-provider" body: "ai_provider"};
  }
  // 更新AI供应商。
  rpc UpdateAiProvider(UpdateAiProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {put: "/api/v1/admin/base/ai-provider/{ai_provider.id}" body: "ai_provider"};
  }
  // 测试AI供应商表单中的全部模型。
  rpc TestAiProviderModels(TestAiProviderModelsRequest) returns (TestAiProviderModelsResponse) {
    option (google.api.http) = {post: "/api/v1/admin/base/ai-provider/test-models" body: "ai_provider"};
  }
  // 删除AI供应商。
  rpc DeleteAiProvider(DeleteAiProviderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/admin/base/ai-provider/{id}"};
  }
  // 设置AI供应商状态。
  rpc SetAiProviderStatus(SetAiProviderStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {put: "/api/v1/admin/base/ai-provider/{id}/status" body: "*"};
  }
}

// AI供应商分页查询条件。
message PageAiProviderRequest {
  string name = 1 [(gnostic.openapi.v3.property) = {description: "供应商名称"}]; // 供应商名称
  optional .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态：枚举【Status】"}]; // 状态：枚举【Status】
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页行数", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页行数
}

// AI供应商分页响应。
message PageAiProviderResponse {
  repeated AiProvider providers = 1 [(gnostic.openapi.v3.property) = {description: "供应商列表"}]; // 供应商列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 查询AI供应商请求。
message GetAiProviderRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "供应商ID"}, (buf.validate.field).int64 = {gt: 0}]; // 供应商ID
}

// AI供应商维护表单。
message AiProviderForm {
  option (buf.validate.message).cel = {id: "system.admin.base.ai.provider.models_json.required" message: "请至少配置一个模型" expression: "this.models_json.size() > 0"};
  reserved 3, 7, 8, 9, 10, 14, 15;
  reserved "type", "organization", "local_host", "local_port", "use_gpu", "description", "icon";

  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "供应商ID"}]; // 供应商ID
  string name = 2 [(gnostic.openapi.v3.property) = {description: "供应商名称"}, (buf.validate.field).cel = {id: "system.admin.base.ai.provider.name.required" message: "请输入供应商名称" expression: "this.size() > 0 && this.size() <= 100"}]; // 供应商名称
  string base_url = 4 [(gnostic.openapi.v3.property) = {description: "模型API基础地址"}, (buf.validate.field).cel = {id: "system.admin.base.ai.provider.base_url.max_length" message: "接口地址不能超过512个字符" expression: "this.size() <= 512"}]; // 模型API基础地址
  string api_key = 5 [(gnostic.openapi.v3.property) = {description: "模型API密钥；更新时留空表示保留现有密钥"}, (buf.validate.field).cel = {id: "system.admin.base.ai.provider.api_key.max_length" message: "模型密钥不能超过1024个字符" expression: "this.size() <= 1024"}]; // 模型API密钥；更新时留空表示保留现有密钥
  bool api_key_configured = 6 [(gnostic.openapi.v3.property) = {description: "是否已保存模型密钥"}]; // 是否已保存模型密钥
  string models_json = 11 [(gnostic.openapi.v3.property) = {description: "多模型JSON数组，每项含model_name、api_type、temperature、max_tokens、timeout_seconds和max_retries"}]; // 多模型JSON数组
  int32 sort = 12 [(gnostic.openapi.v3.property) = {description: "排序值"}, (buf.validate.field).int32 = {gte: 0}]; // 排序值
  string provider = 13 [(gnostic.openapi.v3.property) = {description: "Provider稳定标识：openai_compatible或ollama"}, (buf.validate.field).cel = {id: "system.admin.base.ai.provider.provider.required" message: "请选择模型Provider" expression: "this == 'openai_compatible' || this == 'ollama'"}]; // Provider稳定标识
  google.protobuf.Struct config = 16 [(gnostic.openapi.v3.property) = {description: "Provider个性化配置JSON对象"}]; // Provider个性化配置JSON对象
  .common.v1.Status status = 51 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 创建AI供应商请求。
message CreateAiProviderRequest {
  AiProviderForm ai_provider = 1 [(gnostic.openapi.v3.property) = {description: "AI供应商表单"}, (buf.validate.field).required = true]; // AI供应商表单
}

// 更新AI供应商请求。
message UpdateAiProviderRequest {
  option (buf.validate.message).cel = {id: "system.admin.base.ai.provider.update.id.required" message: "供应商ID不能为空" expression: "this.ai_provider.id > 0"};
  AiProviderForm ai_provider = 1 [(gnostic.openapi.v3.property) = {description: "AI供应商表单"}, (buf.validate.field).required = true]; // AI供应商表单
}

// 测试AI供应商全部模型请求。
message TestAiProviderModelsRequest {
  AiProviderForm ai_provider = 1 [(gnostic.openapi.v3.property) = {description: "待测试的AI供应商草稿"}, (buf.validate.field).required = true]; // 待测试的AI供应商草稿
}

// 单个AI模型连通性测试结果。
message AiProviderModelTestResult {
  string model_name = 1 [(gnostic.openapi.v3.property) = {description: "模型名称"}]; // 模型名称
  bool success = 2 [(gnostic.openapi.v3.property) = {description: "测试是否成功"}]; // 测试是否成功
  int32 duration_ms = 3 [(gnostic.openapi.v3.property) = {description: "测试耗时毫秒"}, (buf.validate.field).int32 = {gte: 0}]; // 测试耗时毫秒
  string message = 4 [(gnostic.openapi.v3.property) = {description: "失败原因；成功时为空"}]; // 失败原因；成功时为空
}

// 测试AI供应商全部模型响应。
message TestAiProviderModelsResponse {
  repeated AiProviderModelTestResult results = 1 [(gnostic.openapi.v3.property) = {description: "按配置顺序返回的模型测试结果"}]; // 模型测试结果
}

// 删除AI供应商请求。
message DeleteAiProviderRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "供应商ID"}, (buf.validate.field).int64 = {gt: 0}]; // 供应商ID
}

// 设置AI供应商状态请求。
message SetAiProviderStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "供应商ID"}, (buf.validate.field).int64 = {gt: 0}]; // 供应商ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// AI供应商分页记录。
message AiProvider {
  reserved 3, 9, 10;
  reserved "type", "description", "icon";

  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "供应商ID"}]; // 供应商ID
  string name = 2 [(gnostic.openapi.v3.property) = {description: "供应商名称"}]; // 供应商名称
  string base_url = 4 [(gnostic.openapi.v3.property) = {description: "模型API基础地址"}]; // 模型API基础地址
  bool api_key_configured = 5 [(gnostic.openapi.v3.property) = {description: "是否已保存模型密钥"}]; // 是否已保存模型密钥
  repeated string model_names = 6 [(gnostic.openapi.v3.property) = {description: "模型名称列表"}]; // 模型名称列表
  int32 sort = 7 [(gnostic.openapi.v3.property) = {description: "排序值"}]; // 排序值
  string provider = 8 [(gnostic.openapi.v3.property) = {description: "Provider稳定标识"}]; // Provider稳定标识
  .common.v1.Status status = 51 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

syntax = "proto3";

package system.admin.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

// BaseAuditResult 定义审计事件的最终处理结果。
// SUCCESS 表示业务完成，FAILURE 表示可预期拒绝，ERROR 表示系统异常。
enum BaseAuditResult {
  // 未指定审计结果。
  BASE_AUDIT_RESULT_UNSPECIFIED = 0;
  // 操作成功。
  BASE_AUDIT_RESULT_SUCCESS = 1;
  // 操作失败。
  BASE_AUDIT_RESULT_FAILURE = 2;
  // 执行异常。
  BASE_AUDIT_RESULT_ERROR = 3;
}

// BaseLoginLogType 定义认证链路产生的登录事件类型。
// 类型用于区分密码、OAuth、MFA、令牌刷新和退出操作的审计统计。
enum BaseLoginLogType {
  // 未指定登录日志类型。
  BASE_LOGIN_LOG_TYPE_UNSPECIFIED = 0;
  // 密码登录。
  BASE_LOGIN_LOG_TYPE_PASSWORD = 1;
  // OAuth 登录。
  BASE_LOGIN_LOG_TYPE_OAUTH = 2;
  // 多因素认证。
  BASE_LOGIN_LOG_TYPE_MFA = 3;
  // 刷新访问令牌。
  BASE_LOGIN_LOG_TYPE_TOKEN_REFRESH = 4;
  // 退出登录。
  BASE_LOGIN_LOG_TYPE_LOGOUT = 5;
}

// BaseOperationAction 定义管理端资源变更的业务动作。
// 动作与资源类型组合后用于生成可检索的操作审计记录。
enum BaseOperationAction {
  // 未指定业务操作动作。
  BASE_OPERATION_ACTION_UNSPECIFIED = 0;
  // 新增资源。
  BASE_OPERATION_ACTION_CREATE = 1;
  // 修改资源。
  BASE_OPERATION_ACTION_UPDATE = 2;
  // 删除资源。
  BASE_OPERATION_ACTION_DELETE = 3;
  // 发布资源。
  BASE_OPERATION_ACTION_PUBLISH = 4;
  // 撤回资源。
  BASE_OPERATION_ACTION_REVOKE = 5;
  // 导入数据。
  BASE_OPERATION_ACTION_IMPORT = 6;
  // 导出数据。
  BASE_OPERATION_ACTION_EXPORT = 7;
  // 其他业务动作。
  BASE_OPERATION_ACTION_OTHER = 8;
}

// BaseDataAccessType 定义读取、导入、导出和下载等数据访问方式。
// 该枚举只描述访问事实，不代表访问是否经过授权。
enum BaseDataAccessType {
  // 未指定数据访问类型。
  BASE_DATA_ACCESS_TYPE_UNSPECIFIED = 0;
  // 列表访问。
  BASE_DATA_ACCESS_TYPE_LIST = 1;
  // 详情访问。
  BASE_DATA_ACCESS_TYPE_DETAIL = 2;
  // 条件查询。
  BASE_DATA_ACCESS_TYPE_QUERY = 3;
  // 导出数据。
  BASE_DATA_ACCESS_TYPE_EXPORT = 4;
  // 下载数据。
  BASE_DATA_ACCESS_TYPE_DOWNLOAD = 5;
  // 导入数据。
  BASE_DATA_ACCESS_TYPE_IMPORT = 6;
}

// BasePermissionTargetType 定义权限变更所作用的安全对象类型。
// 目标可为用户、角色、菜单、API 或租户，便于审计定位授权边界。
enum BasePermissionTargetType {
  // 未指定权限目标类型。
  BASE_PERMISSION_TARGET_TYPE_UNSPECIFIED = 0;
  // 用户权限。
  BASE_PERMISSION_TARGET_TYPE_USER = 1;
  // 角色权限。
  BASE_PERMISSION_TARGET_TYPE_ROLE = 2;
  // 菜单权限。
  BASE_PERMISSION_TARGET_TYPE_MENU = 3;
  // API 权限。
  BASE_PERMISSION_TARGET_TYPE_API = 4;
  // 租户权限。
  BASE_PERMISSION_TARGET_TYPE_TENANT = 5;
}

// BasePermissionAction 定义安全对象及其授权关系的变更动作。
// 授予、回收和对象增删改均应保留对应的审计上下文。
enum BasePermissionAction {
  // 未指定权限动作。
  BASE_PERMISSION_ACTION_UNSPECIFIED = 0;
  // 授予权限。
  BASE_PERMISSION_ACTION_GRANT = 1;
  // 回收权限。
  BASE_PERMISSION_ACTION_REVOKE = 2;
  // 新增权限对象。
  BASE_PERMISSION_ACTION_CREATE = 3;
  // 修改权限对象。
  BASE_PERMISSION_ACTION_UPDATE = 4;
  // 删除权限对象。
  BASE_PERMISSION_ACTION_DELETE = 5;
  // 分配权限。
  BASE_PERMISSION_ACTION_ASSIGN = 6;
}

// BasePolicyEvaluationType 定义授权引擎执行的评估模式。
// 评估可以针对单个资源，也可以批量过滤资源对或项目集合。
enum BasePolicyEvaluationType {
  // 未指定策略评估类型。
  BASE_POLICY_EVALUATION_TYPE_UNSPECIFIED = 0;
  // 单主体单资源鉴权。
  BASE_POLICY_EVALUATION_TYPE_IS_AUTHORIZED = 1;
  // 批量资源动作过滤。
  BASE_POLICY_EVALUATION_TYPE_FILTER_PAIRS = 2;
  // 批量项目过滤。
  BASE_POLICY_EVALUATION_TYPE_FILTER_PROJECTS = 3;
}

// BasePolicyDecision 定义授权策略评估的决策结果。
// ERROR 表示策略引擎未能完成可靠判断，不能按允许访问处理。
enum BasePolicyDecision {
  // 未指定策略决策结果。
  BASE_POLICY_DECISION_UNSPECIFIED = 0;
  // 允许访问。
  BASE_POLICY_DECISION_ALLOW = 1;
  // 拒绝访问。
  BASE_POLICY_DECISION_DENY = 2;
  // 策略引擎异常。
  BASE_POLICY_DECISION_ERROR = 3;
}

// 登录日志服务。
service BaseLoginLogService {
  // 分页查询登录日志。
  rpc PageBaseLoginLog(PageBaseLoginLogRequest) returns (PageBaseLoginLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/login-log"};
  }

  // 查询登录日志详情。
  rpc GetBaseLoginLog(GetBaseLoginLogRequest) returns (BaseLoginLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/login-log/{id}"};
  }
}

// API 访问日志服务。
service BaseApiLogService {
  // 分页查询 API 访问日志。
  rpc PageBaseApiLog(PageBaseApiLogRequest) returns (PageBaseApiLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/api-log"};
  }

  // 查询 API 访问日志详情。
  rpc GetBaseApiLog(GetBaseApiLogRequest) returns (BaseApiLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/api-log/{id}"};
  }
}

// 业务操作日志服务。
service BaseOperationLogService {
  // 分页查询业务操作日志。
  rpc PageBaseOperationLog(PageBaseOperationLogRequest) returns (PageBaseOperationLogResponse) {
    option (google.api.http) = {get: "/api/v1/admin/base/operation-log"};
  }

  // 查询业务操作日志详情。
  rpc GetBaseOperationLog(GetBaseOperationLogRequest) returns (BaseOperationLog) {
    option (google.api.http) = {get: "/api/v1/admin/base/operation-log/{id}"};
  }
}


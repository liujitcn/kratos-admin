syntax = "proto3";

package system.admin.v1;

import "common/v1/enum.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Admin限流规则模板服务。
service BaseRateLimitRuleService {
  // 查询限流规则选项。
  rpc OptionBaseRateLimitRule(OptionBaseRateLimitRuleRequest) returns (OptionBaseRateLimitRuleResponse) { option (google.api.http) = {get: "/api/v1/admin/base/rate-limit-rule/option"}; }
  // 查询限流规则分页列表。
  rpc PageBaseRateLimitRule(PageBaseRateLimitRuleRequest) returns (PageBaseRateLimitRuleResponse) { option (google.api.http) = {get: "/api/v1/admin/base/rate-limit-rule"}; }
  // 查询限流规则详情。
  rpc GetBaseRateLimitRule(GetBaseRateLimitRuleRequest) returns (BaseRateLimitRuleForm) { option (google.api.http) = {get: "/api/v1/admin/base/rate-limit-rule/{id}"}; }
  // 创建限流规则。
  rpc CreateBaseRateLimitRule(CreateBaseRateLimitRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {post: "/api/v1/admin/base/rate-limit-rule", body: "base_rate_limit_rule"}; }
  // 更新限流规则。
  rpc UpdateBaseRateLimitRule(UpdateBaseRateLimitRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/rate-limit-rule/{base_rate_limit_rule.id}", body: "base_rate_limit_rule"}; }
  // 删除限流规则。
  rpc DeleteBaseRateLimitRule(DeleteBaseRateLimitRuleRequest) returns (google.protobuf.Empty) { option (google.api.http) = {delete: "/api/v1/admin/base/rate-limit-rule/{id}"}; }
  // 设置限流规则状态。
  rpc SetBaseRateLimitRuleStatus(SetBaseRateLimitRuleStatusRequest) returns (google.protobuf.Empty) { option (google.api.http) = {put: "/api/v1/admin/base/rate-limit-rule/{id}/status", body: "*"}; }
}

// 限流规则选项查询条件。
message OptionBaseRateLimitRuleRequest {
  string keyword = 1 [(gnostic.openapi.v3.property) = {description: "规则关键字"}]; // 规则关键字
}

// 限流规则选项响应。
message OptionBaseRateLimitRuleResponse {
  repeated BaseRateLimitRuleOption list = 1 [(gnostic.openapi.v3.property) = {description: "规则选项"}]; // 规则选项
}

// 限流规则选项。
message BaseRateLimitRuleOption {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string label = 2 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  string code = 3 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string rule_type = 4 [(gnostic.openapi.v3.property) = {description: "限流算法类型"}]; // 限流算法类型
  string default_params = 5 [(gnostic.openapi.v3.property) = {description: "默认规则参数"}]; // 默认规则参数
  bool disabled = 6 [(gnostic.openapi.v3.property) = {description: "是否禁用"}]; // 是否禁用
}

// 限流规则分页查询条件。
message PageBaseRateLimitRuleRequest {
  string code = 1 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string name = 2 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  optional .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  int64 page_num = 101 [(gnostic.openapi.v3.property) = {description: "当前页码", default: {number: 1}}, (buf.validate.field).int64 = {gte: 1, lte: 1000000}]; // 当前页码
  int64 page_size = 102 [(gnostic.openapi.v3.property) = {description: "每页数量", default: {number: 10}}, (buf.validate.field).int64 = {gte: 1, lte: 100}]; // 每页数量
}

// 限流规则分页响应。
message PageBaseRateLimitRuleResponse {
  repeated BaseRateLimitRule base_rate_limit_rules = 1 [(gnostic.openapi.v3.property) = {description: "规则列表"}]; // 规则列表
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}]; // 总数
}

// 限流规则详情查询条件。
message GetBaseRateLimitRuleRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.get.id.required" message: "规则ID不能为空" expression: "this > 0"}]; // 规则ID
}

// 限流规则表单。
message BaseRateLimitRuleForm {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "规则编码"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.code.required" message: "规则编码不能为空且不超过64个字符" expression: "this.size() > 0 && this.size() <= 64"}]; // 规则编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "规则名称"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.name.required" message: "规则名称不能为空且不超过100个字符" expression: "this.size() > 0 && this.size() <= 100"}]; // 规则名称
  string rule_type = 4 [(gnostic.openapi.v3.property) = {description: "限流算法类型"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.rule_type.required" message: "限流算法类型不能为空且不超过32个字符" expression: "this.size() > 0 && this.size() <= 32"}]; // 限流算法类型
  string default_params = 5 [(gnostic.openapi.v3.property) = {description: "默认规则参数JSON"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.default_params.required" message: "默认规则参数不能为空" expression: "this.size() > 0"}]; // 默认规则参数JSON
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.remark.length" message: "备注不能超过500个字符" expression: "this.size() <= 500"}]; // 备注
}

// 创建限流规则请求参数。
message CreateBaseRateLimitRuleRequest {
  BaseRateLimitRuleForm base_rate_limit_rule = 1 [(gnostic.openapi.v3.property) = {description: "限流规则表单"}, (buf.validate.field).required = true]; // 限流规则表单
}

// 更新限流规则请求参数。
message UpdateBaseRateLimitRuleRequest {
  BaseRateLimitRuleForm base_rate_limit_rule = 1 [(gnostic.openapi.v3.property) = {description: "限流规则表单"}, (buf.validate.field).required = true]; // 限流规则表单
}

// 删除限流规则请求参数。
message DeleteBaseRateLimitRuleRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID列表"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.delete.id.required" message: "规则ID列表不能为空" expression: "this.size() > 0"}]; // 规则ID列表
}

// 设置限流规则状态请求参数。
message SetBaseRateLimitRuleStatusRequest {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}, (buf.validate.field).cel = {id: "system.admin.base.rate_limit_rule.status.id.required" message: "规则ID不能为空" expression: "this > 0"}]; // 规则ID
  .common.v1.Status status = 2 [(gnostic.openapi.v3.property) = {description: "状态"}, (buf.validate.field).enum = {defined_only: true}]; // 状态
}

// 限流规则模板。
message BaseRateLimitRule {
  int64 id = 1 [(gnostic.openapi.v3.property) = {description: "规则ID"}]; // 规则ID
  string code = 2 [(gnostic.openapi.v3.property) = {description: "规则编码"}]; // 规则编码
  string name = 3 [(gnostic.openapi.v3.property) = {description: "规则名称"}]; // 规则名称
  string rule_type = 4 [(gnostic.openapi.v3.property) = {description: "限流算法类型"}]; // 限流算法类型
  string default_params = 5 [(gnostic.openapi.v3.property) = {description: "默认规则参数JSON"}]; // 默认规则参数JSON
  .common.v1.Status status = 100 [(gnostic.openapi.v3.property) = {description: "状态"}]; // 状态
  string remark = 102 [(gnostic.openapi.v3.property) = {description: "备注"}]; // 备注
  string created_at = 200 [(gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  string updated_at = 201 [(gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

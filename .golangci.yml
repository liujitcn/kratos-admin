# 静态检查配置：机械化执行“禁止手写 SQL”约束（见 AGENTS.md 数据库查询节）
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: .*\.Raw$
          msg: 禁止手写 SQL，优先使用 gorm/gen 类型化查询
        - pattern: gorm\.Expr$
          msg: 禁止手写 SQL 表达式，优先使用 gorm/gen 字段表达式
        - pattern: .*\.NewUnsafeFieldRaw$
          msg: 禁止 unsafe 原生字段表达式
        - pattern: .*\.UnderlyingDB$
          msg: 禁止绕过 gorm/gen 直接操作底层 DB；确有必要时加 //nolint:forbidigo 并说明原因

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - api/gen
      - pkg/gen
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
